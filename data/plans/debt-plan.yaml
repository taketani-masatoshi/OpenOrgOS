    全額役員貸付（無利息）。銀行借入予定なし（business-plan.yaml borrowing_plan: 0 と整合）。
    返済開始時期・年次返済額は契約上「協議」のため、本計画は目安シナリオ。確定後 loans.yaml と CTR 返済 MD を更新。

policies:
  - id: POL-DEBT-001
    title: 調達方針
    description: 物件取得資金は役員貸付（段燕燕・宮城万貴子 各50%）で調達。銀行借入は計画しない。
  - id: POL-DEBT-002
    title: 金利条件
    description: 現行 LOAN-001/002 は無利息（年0%）。利息支払は debt service に含めない。
  - id: POL-DEBT-003
    title: 返済方針
    description: 亀沢開業・運転資金優先。営業CF・稼働状況を勘案し代表取締役2名で協議の上、任意返済。
  - id: POL-DEBT-004
    title: DSCR 管理
    description: 内部目標 DSCR ≥ 1.2。1.0 未満は返済ペース見直し（保守シナリオへ切替）を検討。銀行 covenant なし。

