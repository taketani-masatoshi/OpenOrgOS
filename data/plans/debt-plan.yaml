dscr:
  targets:
    minimum: 1.2
    warning: 1.0
    notes: 内部管理目標。銀行借入なしのため covenant ではない。
  assumptions: |
    NOI 代理指標: profit-plan.yaml の operating_profit（全社営業利益）。
    FY2029 以降は FY2028 計画値（817万/年）を横ばい前提（TBD: 中期計画更新で再算定）。
    debt service = 元本返済のみ（無利息）。返済ゼロ年は DSCR = N/A。
    参考月次CF: data/finance/monthly/2027-01.yaml（売上115万・利益約62万/月）。
  projections:
    - fiscal_year: FY2027
      scenario_id: base
      noi_proxy: 7839000
      debt_service: 0
      dscr: null
      status: n_a
      notes: 返済猶予期
    - fiscal_year: FY2028
      scenario_id: base
      noi_proxy: 8170950
      debt_service: 2000000
      dscr: 4.09
      status: ok
    - fiscal_year: FY2030
      scenario_id: base
      noi_proxy: 8170950
      debt_service: 10000000
      dscr: 0.82
      status: critical
      notes: 目標1.2未達。返済ペース見直しまたは保守シナリオ採用を協議（TBD）
    - fiscal_year: FY2030
      scenario_id: conservative
      noi_proxy: 8170950
