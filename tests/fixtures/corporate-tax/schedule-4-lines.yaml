  - { row: "48", label: 農用地等を取得した場合の圧縮額の損金算入額 }
  - { row: "49", label: 関西国際空港用地整備準備金積立額、中部国際空港整備準備金積立額又は再投資等準備金積立額の損金算入額 }
  - { row: "50", label: 特定事業活動として特別新事業開拓事業者の株式の取得をした場合の特別勘定繰入額の損金算入額又は特別勘定取崩額の益金算入額 }
  - { row: "51", label: 残余財産の確定の日の属する事業年度に係る事業税及び特別法人事業税の損金算入額 }
