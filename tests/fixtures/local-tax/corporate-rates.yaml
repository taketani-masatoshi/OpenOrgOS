# 製品コードは読まない。試験がこの率を渡し、出力との差分が空のときだけ 6。
# 地方法人税の 10.3% は国税庁 No.5759（法人税の税率）には無い。
# 充足: 東京都主税局「分割基準のガイドブック」の印刷円＋第6号様式欄⑬/㉜。
# ピン: tests/fixtures/local-tax/tokyo-bunkatu-example.yaml

sources:
  local_corporate: "国税庁「地方法人税の税率の改正のお知らせ」令和元年10月1日以後10.3% https://www.nta.go.jp/publication/pamph/hojin/chihou_hojin/01.htm 。地方法人税法第10条。端数は国税通則法第119条第1項の百円未満切捨て。"
  inhabitant_rates: "総務省「法人住民税」法人税割は都道府県1.0%・市町村6.0%、均等割は資本金等と従業者数の表 https://www.soumu.go.jp/main_sosiki/jichi_zeisei/czaisei/czaisei_seido/150790_08.html"
  inhabitant_split: "地方税法第57条第2項・第321条の13第2項。法人税割は算定期間末日の従業者数で按分する。総務省の計算例（資本金5,000万円・法人税額200万円・A20人B60人C20人）と同じ円。"
  inhabitant_tokyo_equal: "東京都主税局 FAQ 均等割計算例（Ａ区分／Ｂ区分）年額70000・6か月35000・5か月29100・合計64100 https://www.tax.metro.tokyo.lg.jp/shitsumon/work/a1 — 住民税のみでは充足にしない。"
  enterprise_rates: "総務省「法人事業税」資本金1億円以下の普通法人は所得400万円以下3.5%・800万円以下5.3%・超7.0%、特別法人は400万円以下3.5%・超4.9% https://www.soumu.go.jp/main_sosiki/jichi_zeisei/czaisei/czaisei_seido/150790_09.html — 税率表のみ。"
  enterprise_tokyo_split_guide: "東京都主税局「分割基準のガイドブック」所得割計算例（所得36173千円・区分1412/1412/9953千円・都税率で税額52900/79900/744400・計877200）と法人税割（557千円×10.4%=57900） https://www.tax.metro.tokyo.lg.jp/documents/d/tax/houjin_bunkatu"
  form6_line_ids: "第6号様式記載要領の差引法人税割額⑬・所得割計㉜ https://www.tax.metro.tokyo.lg.jp/documents/d/tax/06_6-3-b"
  enterprise_per_capita: "総務省「法人事業税」は付加価値割・資本割・所得割・収入割であり、均等割は置かない。同URL。"
  enterprise_split: "地方税法第72条の48第3項第1号は製造業を従業者数、第5号はその他の事業を課税標準の2分の1ずつ事業所数と従業者数。"
  local_rounding: "地方税法第20条の4の2第1項は課税標準の千円未満切捨て、第3項は確定金額の百円未満切捨て。"

