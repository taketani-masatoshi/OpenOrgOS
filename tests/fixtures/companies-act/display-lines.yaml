# Pin for Companies Act display headings.
# Source (labels only): e-Gov 会社計算規則（平成十八年法務省令第十三号, lawId 418M60000010013）
# https://laws.e-gov.go.jp/document?lawid=418M60000010013_20220901_502M60000010052
# Item labels read from that text. Articles are the ArticleTitle strings.
#
# example_yen is intentionally absent. companiesActDisplayScore stays 0 until an
# official published worked example prints yen that can be compared to statement
# amounts (heading-only match is not 充足). Do not invent yen or echo the emitter.
#
# Honest search (2026-09-22, rechecked twice same day) — no qualifying filled-yen statement found:
# - 会社計算規則 (e-Gov): names only (売上総利益金額 etc.), no yen.
# - 国税庁「法人税のあらましと申告の手引」設例 PL:
#   https://www.nta.go.jp/publication/pamph/hojin/aramashi2025/pdf/01-05.pdf
#   Most PL lines are ×××; 法人税等 150000 / 当期純利益 600000 only;
#   labels omit 「金額」 (営業利益 / 税引前当期純利益). Partial ≠ 充足.
# - 中小企業庁「中小企業の会計 31問31答」様式例:
#   https://www.chusho.meti.go.jp/zaimu/kaikei/tools/2008/06.html
#   Letter placeholders (A–Q), not printed yen; labels omit 「金額」.
# - 「中小企業の会計に関する指針」(ASBJ/JICPA 等) 決算公告例示:
#   https://www.asb-j.jp/jp/wp-content/uploads/sites/4/sme24_01.pdf
#   PL uses ××× and letter Q; labels 売上総利益 not 売上総利益金額.
# - 経団連計算書類ひな型: ×××; private association, not MoJ/NTA/METI.
# - GEPS「財務諸表（株式会社例）」:
#   https://www.p-portal.go.jp/pps-web-biz/geps-chotatujoho/resources/app/pdf/zaimu_h.pdf
#   Has yen (e.g. 売上総利益 60000) but procurement sample; shortened labels;
#   not a Companies Act form pin (heading mismatch → not 充足).
# - 法務省 / 法務局: no Kabushiki-gaisha calculation-documents worked example
#   with filled yen matching ordinance display names was found.
# Do not invent example_yen. Do not award 12 from heading match alone.
