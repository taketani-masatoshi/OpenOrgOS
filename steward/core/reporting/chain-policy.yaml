# 実行報告の中継ポリシー（組織上の上司ではない）
# 組織線は steward/core/agents/registry.yaml の reports_to が正本。
# 本ファイルは現場 Agent の pulse / Work Order 完了報告を
# COO が Executive Steward へ中継する transport policy。
# CLI: orgos agent order | report | relay

version: "1.0"
hub_agent: coo
executive_agent: executive_steward
excluded_from_field:
  - executive_steward
  - coo
auto_forward_pulse: true
auto_forward_work_order_complete: true
