# Core Agent レジストリ — 選択的拡張
# テナントは data/operator/agents.yaml で ON/OFF · 既定 activation: tenant

version: 3

defaults:
  class: operational
  activation: tenant
  dispatch_modes: [consult, implement]
  readiness_profile: operational
  auto_route: true
  auto_pulse: true

# Legacy module-facing IDs remain accepted by schemas, but resolve to the
# operational owner. They are not independent always-active Agent records.
aliases:
  property_rental: operations
  hospitality: operations

agents:
  executive_steward:
    id: executive_steward
    name: Steward Agent
    name_ja: ステュワード（経営統括）
    path: steward/core/agents/executive_steward_agent.md
    tier: core
    required: true
    scope: 経営判断 · KPI · ダッシュボード · 要約統合
    access:
      read:
        - docs/reports/dashboard/
        - docs/reports/agent-summaries/
        - docs/reports/executive-notes/
      write:
        - docs/reports/dashboard/
        - docs/reports/executive-notes/
        - docs/reports/agent-summaries/executive-steward/

  integration:
    id: integration
    name: Integration Agent
    name_ja: 統合
    path: steward/core/agents/integration_agent.md
    tier: extension
    required: false
    status: active
    reports_to: executive_steward
    scope: 横断統合 · module-messages · routing-queue 読取 · 正データ非編集
    access:
      read:
        - docs/reports/agent-summaries/
        - docs/reports/routing-queue/
        - docs/reports/dashboard/
        - data/org/module-messages/
      write:
        - docs/reports/executive-notes/
        - data/org/module-messages/
    capability:
      summary_slug: integration
      data_paths:
        - data/org/module-messages/
      docs_paths:
        - docs/reports/executive-notes/
      pulse_checks:
        - type: path_exists
          path: docs/reports/agent-summaries/

  secretary:
    id: secretary
    name: Secretary Agent
    name_ja: 秘書
    path: steward/core/agents/secretary_agent.md
    tier: core
    required: true
    reports_to: coo
    scope: スケジュール · タスク · 1-on-1 · 対外下書き
    access:
      read:
        - data/executive/
        - docs/executive/
        - docs/reports/dashboard/
      write:
        - data/executive/
        - docs/executive/
        - docs/reports/agent-summaries/secretary/

  mail_intake:
    id: mail_intake
    name: Mail Intake Agent
    name_ja: メール取込
    path: steward/core/agents/mail_intake_agent.md
    tier: extension
    required: false
    status: active
    reports_to: secretary
    scope: 受信監視 · 分類 · 通知 · Mail Outbound ハンドオフ
    access:
      read:
        - data/executive/
        - records/executive/mail-received/
        - steward/core/correspondence/
      write:
        - data/executive/mail-triage-queue.yaml
        - data/executive/sender-identification-queue.yaml
        - data/executive/ceo-inline-questions.yaml
        - data/executive/mail-interpretation-queue.yaml
    capability:
      summary_slug: mail-intake
      data_paths:
        - data/executive/
      docs_paths: []
      pulse_checks:
        - type: path_exists
          path: data/executive/

  mail_outbound:
    id: mail_outbound
    name: Mail Outbound Agent
    name_ja: メール送信
    path: steward/core/agents/mail_outbound_agent.md
    tier: extension
    required: false
    status: active
    reports_to: secretary
    scope: 社外メール下書き · 承認起案 · 承認済み送信
    access:
      read:
        - data/executive/
        - data/org/pending-approvals.yaml
        - docs/executive/correspondence-drafts/
        - records/executive/
      write:
        - docs/executive/correspondence-drafts/
    capability:
      summary_slug: mail-outbound
      data_paths:
        - data/executive/external-contacts.yaml
      docs_paths:
        - docs/executive/correspondence-drafts/
      pulse_checks:
        - type: path_exists
          path: docs/executive/

