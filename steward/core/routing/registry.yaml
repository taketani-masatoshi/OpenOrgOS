    description: 契約期限・更新アラート
    agent: contract
    skill: contract_expiry_check
    priority: 80
    resource_paths:
      - data/company.yaml
    match:
      keywords:
        - 契約期限
        - 契約更新
        - 期限切れ
        - 契約アラート
      paths:
        - data/contracts/
        - docs/contracts/

