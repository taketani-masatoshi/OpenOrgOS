# 集計キーは税抜本体。課税標準は税率ごとに千円未満切捨ててから足す。
id: jp-consumption-return-general-standard-reiwa7-2025-11
form: 法人・本則・割戻し・一般用
source_label: 国税庁 法人用 申告書（一般用）の書き方（令和7年11月）
submission: not-for-etax
disclaimer: 提出しない。公式の申告書でも e-Tax 用データでもない。
rows:
