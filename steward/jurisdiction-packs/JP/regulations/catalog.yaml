# 社内規程カタログ — Japan Jurisdiction Pack
# 正本: steward/jurisdiction-packs/JP/regulations/catalog.yaml
# 旧 path steward/standards/regulations/catalog.yaml は非正本（参照コメントのみ）
# テナント有効化: tenants/{id}/regulations.yaml · jurisdiction: JP

regulations:
  # ── ガバナンス（常時） ──
  - id: REG-001
    name: 役員報酬規程
    template: core/REG-001-yakuin-hoshu/template.md
    tenant_doc: yakuin-hoshu-kisoku.md
    binds_to: { type: core, group: governance }

  - id: REG-002
    name: 取締役会議事規則
    template: core/REG-002-torishimari-kai/template.md
    tenant_doc: torishimari-kai-gijisho-kisoku.md
    binds_to: { type: core, group: governance }

  - id: REG-003
    name: 株主総会議事規則
    template: core/REG-003-shukai-gijisho/template.md
    tenant_doc: shukai-gijisho-kisoku.md
    binds_to: { type: core, group: governance }

  - id: REG-004
    name: 稟議・決裁規程
    template: core/REG-004-ringi-kessai/template.md
    tenant_doc: ringi-kessai-kisoku.md
    binds_to: { type: core, group: governance }

  - id: REG-005
    name: 経費精算規程
    template: core/REG-005-keihi-seisan/template.md
    tenant_doc: keihi-seisan-kisoku.md
    binds_to: { type: core, group: governance }

  - id: REG-006
    name: 利益相反取引規程
    template: core/REG-006-riekisohan/template.md
    tenant_doc: riekisohan-torihiki-kisoku.md
    binds_to: { type: core, group: governance }

  - id: REG-007
    name: 文書管理規程
    template: core/REG-007-bunsho-kanri/template.md
    tenant_doc: bunsho-kanri-kisoku.md
    binds_to: { type: core, group: governance }
    iso_ids: [ISO-9001, ISO-27001]

  - id: REG-008
    name: 旅費規程
    template: core/REG-008-ryohi/template.md
    tenant_doc: ryohi-kisoku.md
    binds_to: { type: core, group: governance }

  - id: REG-027
    name: 経理規程
    template: core/REG-027-keiri/template.md
    tenant_doc: keiri-kisoku.md
    binds_to: { type: core, group: governance }
    risk_domains: [cash]
    notes: 記帳 · 決算 · 資金（jp_bank_corporate は本規程を必須化）

  - id: REG-028
    name: クレジットカード規程
    template: core/REG-028-credit-card/template.md
    tenant_doc: credit-card-kisoku.md
    binds_to: { type: core, group: governance }

  - id: REG-029
    name: 役員退職金規程
    template: core/REG-029-yakuin-taishoku/template.md
    tenant_doc: yakuin-taishoku-kisoku.md
    binds_to: { type: core, group: governance }

  - id: REG-030
    name: 組織情報システム権限管理規程
    template: core/REG-030-soshiki-joho-system/template.md
    tenant_doc: soshiki-joho-system-kengen-kisoku.md
    binds_to: { type: core, group: governance }
    risk_domains: [access]
    notes: Operator Console · Wire · 承認/振込の横断権限

  # ── 税務・金流リスク領域（申告準備 · 提出は人間/税理士） ──
  - id: REG-031
    name: 法人税務・申告準備規程
    template: by-module/jp_tax_corporate/REG-031-hojin-zeimu/template.md
    tenant_doc: hojin-zeimu-kisoku.md
    binds_to: { type: module, module_id: jp_tax_corporate }
    risk_domains: [cash, tax]
    notes: 申告 XML · e-Tax 送信はスコープ外（社内準備手続）

  - id: REG-032
    name: 消費税務規程
    template: by-module/jp_tax_consumption/REG-032-shohi-zeimu/template.md
    tenant_doc: shohi-zeimu-kisoku.md
    binds_to: { type: module_any, module_ids: [jp_tax_consumption, jp_consumption_refund] }
    risk_domains: [cash, tax]
    notes: 課税区分 · 期間集計 · 還付（jp_consumption_refund を同規程に吸収）

  - id: REG-033
    name: 適格請求書管理規程
    template: by-module/jp_invoice_qualified/REG-033-tekikaku-seikyusho/template.md
    tenant_doc: tekikaku-seikyusho-kisoku.md
    binds_to: { type: module, module_id: jp_invoice_qualified }
    risk_domains: [cash, tax]
    notes: インボイス登録番号 · 発行/受領確認

  - id: REG-034
    name: 源泉徴収・法定調書規程
    template: by-module/jp_withholding_statutory/REG-034-gensen-hoteichosho/template.md
    tenant_doc: gensen-hoteichosho-kisoku.md
    binds_to: { type: module, module_id: jp_withholding_statutory }
    risk_domains: [cash, tax, pii]
    notes: 源泉 · 年末調整 · 法定調書の期限管理

  - id: REG-035
    name: 給与規程
    template: by-module/jp_payroll/REG-035-kyuyo/template.md
    tenant_doc: kyuyo-kisoku.md
    binds_to: { type: module, module_id: jp_payroll }
    risk_domains: [cash, pii]
    notes: 給与計算 · 個人明細分離（社保は REG-036）

  - id: REG-036
    name: 社会保険手続規程
    template: by-module/jp_social_insurance/REG-036-shakai-hoken/template.md
    tenant_doc: shakai-hoken-kisoku.md
    binds_to: { type: module, module_id: jp_social_insurance }
    risk_domains: [pii]
    notes: 資格 · 算定 · 月変の社内準備

  - id: REG-037
    name: 許認可管理規程
    template: by-module/jp_permit/REG-037-kyoka-kanri/template.md
    tenant_doc: kyoka-kanri-kisoku.md
    binds_to:
      type: module_any
      module_ids: [jp_permit_application, jp_permit_registry, jp_minpaku]
    risk_domains: [permit]
    notes: 申請 · 台帳 · 民泊運用を1本化

  # ── MS / ISO 連動 ──
  - id: REG-009
    name: 情報セキュリティ管理規程
    template: core/REG-009-joho-security/template.md
    tenant_doc: joho-security-kanri-kisoku.md
    binds_to: { type: iso, iso_id: ISO-27001 }
    iso_ids: [ISO-27001]

  - id: REG-010
    name: 個人情報保護規程
    template: core/REG-010-kojin-joho/template.md
    tenant_doc: kojin-joho-hogo-kisoku.md
    binds_to: { type: core, group: governance }
    iso_ids: [ISO-27001, ISO-21401]
    risk_domains: [pii]
    notes: 全事業横断 · 常時施行想定 · PII ゲートで厚化必須

  - id: REG-011
    name: 品質管理規程
    template: core/REG-011-hinshitsu/template.md
    tenant_doc: hinshitsu-kanri-kisoku.md
    binds_to: { type: iso, iso_id: ISO-9001 }
    iso_ids: [ISO-9001]

  - id: REG-013
    name: 事業継続・危機管理規程
    template: core/REG-013-jigyo-keizoku/template.md
    tenant_doc: jigyo-keizoku-kisoku.md
    binds_to: { type: iso, iso_id: ISO-22301 }
    iso_ids: [ISO-22301]

  - id: REG-014
    name: 環境・エネルギー管理規程
    template: core/REG-014-kankyo-energy/template.md
    tenant_doc: kankyo-energy-kanri-kisoku.md
    binds_to:
      type: iso_any
      iso_ids: [ISO-14001, ISO-50001, ISO-21401]
    iso_ids: [ISO-14001, ISO-50001, ISO-21401]

  - id: REG-015
    name: 安全衛生管理規程
    template: core/REG-015-anzen-eisei/template.md
    tenant_doc: anzen-eisei-kanri-kisoku.md
    binds_to: { type: iso, iso_id: ISO-45001 }
    iso_ids: [ISO-45001, ISO-21401]

  - id: REG-016
    name: 内部監査規程
    template: core/REG-016-naibu-kansa/template.md
    tenant_doc: naibu-kansa-kisoku.md
    binds_to: { type: core, group: ms }
    iso_ids: [ISO-9001, ISO-27001, ISO-21401]
    notes: J-SOX 社内評価は本規程＋REG-027 で分界（専用 REG なし）

  # ── 事業モジュール連動 ──
  - id: REG-012
    name: 宿泊運営・サステナビリティ規程
