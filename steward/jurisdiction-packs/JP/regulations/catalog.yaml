    binds_to: { type: module, module_id: education }

  - id: REG-022
    name: EC取引規程
    template: by-module/ecommerce/REG-022-ec-torihiki/template.md
    tenant_doc: ec-torihiki-kisoku.md
    binds_to: { type: module, module_id: ecommerce }

  - id: REG-023
    name: 配送・倉庫管理規程
