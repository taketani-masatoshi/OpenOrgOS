    iso_ids: [ISO-13485]

  - id: REG-019
    name: 現場安全衛生規程
    template: by-module/construction/REG-019-genba-anzen/template.md
    tenant_doc: genba-anzen-kanri-kisoku.md
    binds_to: { type: module, module_id: construction }
