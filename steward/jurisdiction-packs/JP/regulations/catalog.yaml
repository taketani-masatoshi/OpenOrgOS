  - id: REG-020
    name: 労働派遣管理規程
    template: by-module/staffing/REG-020-haken-rodo/template.md
    tenant_doc: haken-rodo-kanri-kisoku.md
    binds_to: { type: module, module_id: staffing }

  - id: REG-021
    name: 受講者情報管理規程
    template: by-module/education/REG-021-jugyo-joho/template.md
