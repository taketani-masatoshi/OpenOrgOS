version: "1"
standard: ISO-9001
notes: HLS 共通統制は steward/standards/iso/core/ に集約。ここには 9001 固有のものだけを置く。
core_bindings:
  - work: scope
    clause: "4.3"
    evidence_paths: [docs/company/regulations/hinshitsu-kanri-kisoku.md]
    reg_refs:
      - { reg_id: REG-011, articles: ["第2条"] }
  - work: policy
    clause: "5.2"
    evidence_paths: [docs/company/regulations/hinshitsu-kanri-kisoku.md]
    reg_refs:
      - { reg_id: REG-011, articles: ["第3条"] }
  - work: risk_approach
    clause: "6.1"
    evidence_paths: [docs/compliance/iso/ISO-9001/risk-opportunities.csv]
    reg_refs:
      - { reg_id: REG-011, articles: ["第3条の3"] }
  - work: objectives_monitoring
    clause: "6.2"
    evidence_paths: [docs/compliance/iso/ISO-9001/quality-objectives.md]
    reg_refs:
      - { reg_id: REG-011, articles: ["第3条の2"] }
  - work: objectives_monitoring
    clause: "9.1"
    evidence_paths: [docs/compliance/iso/ISO-9001/quality-objectives.md]
    reg_refs:
      - { reg_id: REG-011, articles: ["第9条"] }
  - work: competence
    clause: "7.2"
    evidence_paths: [docs/company/regulations/hinshitsu-kanri-kisoku.md]
    reg_refs:
      - { reg_id: REG-011, articles: ["第4条の3"] }
  - work: documented_information
    clause: "7.5"
    reg_refs:
      - { reg_id: REG-007, articles: ["第4条の2"] }
  - work: internal_audit
    clause: "9.2"
    reg_refs:
      - { reg_id: REG-016, articles: ["第4条", "第5条"] }
  - work: management_review
    clause: "9.3"
    reg_refs:
      - { reg_id: REG-016, articles: ["第7条"] }
  - work: corrective_action
    clause: "10.2"
    evidence_paths: [docs/compliance/iso/ISO-9001/nonconformance-log.csv]
    reg_refs:
      - { reg_id: REG-011, articles: ["第8条"] }
      - { reg_id: REG-016, articles: ["第6条"] }
controls:
  - id: CTL-9001-4.4
    title: プロセス及びその相互作用
    domain: quality
    iso_refs:
      - { standard: ISO-9001, clause: "4.4" }
    reg_refs:
      - { reg_id: REG-011, articles: ["第4条の2"] }
    primary_agent: quality_assurance
    secondary_agents: [operations]
    evidence_paths:
      - docs/company/regulations/hinshitsu-kanri-kisoku.md
    check_type: policy
    target_maturity: L2

  - id: CTL-9001-8.7
    title: 不適合な出力の管理
    domain: quality
    iso_refs:
      - { standard: ISO-9001, clause: "8.7" }
    reg_refs:
      - { reg_id: REG-011, articles: ["第8条"] }
    primary_agent: quality_assurance
    secondary_agents: [operations]
    evidence_paths:
      - docs/compliance/iso/ISO-9001/nonconformance-log.csv
    check_type: record
    target_maturity: L2
