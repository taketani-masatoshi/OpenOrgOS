# ISO pack catalog — machine-readable index (not the ISO text).
# Control maps: steward/standards/iso/ISO-XXXX/control-map.yaml
# Shared HLS controls: steward/standards/iso/core/control-map.yaml
# Loader: src/lib/iso-catalog.ts · CLI: orgos iso catalog | roadmap | maps verify | scaffold
#
# status: available    — pack folder + control-map.yaml exist and load
#         coming_soon  — roadmap entry only; cannot be enabled in standards.yaml
# core_profile: binding profile used by `orgos iso scaffold` (see core/profiles.yaml)

