version: "1"
standard: ISO-27001
requirements:
  - id: REQ-27001-4.1-a
    clause: "4.1"
    statement: マネジメントシステムの意図した成果に影響する外部及び内部の課題を決定する
    source: paraphrase
    controls:
      - CTL-CORE-scope
  - id: REQ-27001-4.1-b
    clause: "4.1"
    statement: 利害関係者及びその関連するニーズ・期待を決定する
    source: paraphrase
    controls:
      - CTL-CORE-scope
  - id: REQ-27001-4.1-c
    clause: "4.1"
    statement: マネジメントシステムの適用範囲を決定し、文書化した情報として維持する
    source: paraphrase
    controls:
      - CTL-CORE-scope
  - id: REQ-27001-5.2-a
    clause: "5.2"
    statement: トップマネジメントはマネジメントシステムに関するリーダーシップ及びコミットメントを実証する
    source: paraphrase
    controls:
      - CTL-CORE-policy
  - id: REQ-27001-5.2-b
    clause: "5.2"
    statement: 方針を確立し、文書化した情報として維持する
    source: paraphrase
    controls:
      - CTL-CORE-policy
  - id: REQ-27001-5.2-c
    clause: "5.2"
    statement: 方針を組織内に伝達し、必要に応じて利害関係者が入手できるようにする
    source: paraphrase
    controls:
      - CTL-CORE-policy
  - id: REQ-27001-5.2-d
    clause: "5.2"
    statement: 関連する役割に対して責任及び権限を割り当て、伝達する
    source: paraphrase
    controls:
      - CTL-CORE-policy
  - id: REQ-27001-6.1.2-a
    clause: 6.1.2
    statement: リスク及び機会を決定する
    source: paraphrase
    controls:
      - CTL-CORE-risk-approach
  - id: REQ-27001-6.1.2-b
    clause: 6.1.2
    statement: リスク及び機会への取組みを計画し、その結果を文書化した情報として保持する
    source: paraphrase
    controls:
      - CTL-CORE-risk-approach
  - id: REQ-27001-7.2-a
    clause: "7.2"
    statement: 業務を行う人に必要な力量を決定し、教育訓練等によって力量を確保する
    source: paraphrase
    controls:
      - CTL-CORE-competence
  - id: REQ-27001-7.2-b
    clause: "7.2"
    statement: 力量の証拠として適切な文書化した情報を保持する
    source: paraphrase
    controls:
      - CTL-CORE-competence
  - id: REQ-27001-7.2-c
    clause: "7.2"
    statement: 従業者が方針・自らの貢献・不適合の意味を認識するようにする
    source: paraphrase
    controls:
      - CTL-CORE-competence
  - id: REQ-27001-7.5-a
    clause: "7.5"
    statement: 規格が要求する文書化した情報及び有効性に必要と判断した情報を維持する
    source: paraphrase
    controls:
      - CTL-CORE-doc-control
  - id: REQ-27001-7.5-b
    clause: "7.5"
    statement: 文書化した情報の作成・更新・管理（配付・アクセス・保管・変更管理）を行う
    source: paraphrase
    controls:
      - CTL-CORE-doc-control
  - id: REQ-27001-9.2-a
    clause: "9.2"
    statement: 内部監査プログラムを計画し、頻度・方法・責任・報告を定めて実施する
    source: paraphrase
    controls:
      - CTL-CORE-internal-audit
  - id: REQ-27001-9.2-b
    clause: "9.2"
    statement: 監査プロセスの客観性及び公平性を確保する監査員を選定する
    source: paraphrase
    controls:
      - CTL-CORE-internal-audit
  - id: REQ-27001-9.3-a
    clause: "9.3"
    statement: トップマネジメントが定めた間隔でマネジメントシステムをレビューする
    source: paraphrase
    controls:
      - CTL-CORE-management-review
  - id: REQ-27001-9.3-b
    clause: "9.3"
    statement: マネジメントレビューの結果の証拠として文書化した情報を保持する
    source: paraphrase
    controls:
      - CTL-CORE-management-review
  - id: REQ-27001-6.1.3-a
    clause: 6.1.3
    statement: リスク対応 · 統制選択（適用宣言書）を実施し、文書化した情報として保持する
    source: paraphrase
    controls:
      - CTL-27001-6.2
  - id: REQ-27001-A.5.1-a
    clause: A.5.1
    statement: 情報セキュリティポリシーを実施し、文書化した情報として保持する
    source: paraphrase
    controls:
      - CTL-27001-A.5.1
  - id: REQ-27001-A.5.10-a
    clause: A.5.10
    statement: 情報の分類を実施し、文書化した情報として保持する
    source: paraphrase
    controls:
      - CTL-27001-A.5.10
  - id: REQ-27001-A.8.1-a
    clause: A.8.1
    statement: ユーザー端末 · アクセスを実施し、文書化した情報として保持する
    source: paraphrase
    controls:
      - CTL-27001-A.8.1
  - id: REQ-27001-A.5.34-a
    clause: A.5.34
    statement: 個人情報保護統制を実施し、文書化した情報として保持する
    source: paraphrase
    controls:
      - CTL-CORE-privacy
  - id: REQ-27001-6.1.3-b
    clause: 6.1.3
    statement: 適用宣言書で選択した管理策と除外理由を維持する
    source: paraphrase
    controls:
      - CTL-27001-6.2
  - id: REQ-27001-A.8.1-b
    clause: A.8.1
    statement: アクセス権限を定期にレビューし、不要な権限を除去する
    source: paraphrase
    controls:
      - CTL-27001-A.8.1
