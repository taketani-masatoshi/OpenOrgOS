version: "1"
standard: ISO-27001
controls:
  - id: CTL-27001-4.1
    title: 組織の状況の理解
    domain: security
    iso_refs:
      - { standard: ISO-27001, clause: "4.1" }
    reg_refs:
      - { reg_id: REG-009, articles: ["第2条"] }
    primary_agent: security
    secondary_agents: [compliance]
    evidence_paths:
      - docs/company/regulations/joho-security-kanri-kisoku.md
    check_type: policy
    target_maturity: L2

  - id: CTL-27001-5.2
    title: 情報セキュリティ方針
    domain: security
    iso_refs:
      - { standard: ISO-27001, clause: "5.2" }
    reg_refs:
      - { reg_id: REG-009, articles: ["第3条"] }
    primary_agent: security
    secondary_agents: [compliance]
    evidence_paths:
      - docs/company/regulations/joho-security-kanri-kisoku.md
    check_type: policy
    target_maturity: L2

  - id: CTL-27001-6.1
    title: リスクアセスメント
    domain: security
    iso_refs:
      - { standard: ISO-27001, clause: "6.1.2" }
    reg_refs:
      - { reg_id: REG-009, articles: ["第4条"] }
    primary_agent: security
    evidence_paths:
      - docs/compliance/iso/ISO-27001/risk-register.csv
    check_type: record
    target_maturity: L2

  - id: CTL-27001-6.2
    title: リスク対応 · 統制選択
    domain: security
    iso_refs:
      - { standard: ISO-27001, clause: "6.1.3" }
    reg_refs:
      - { reg_id: REG-009, articles: ["第4条"] }
    primary_agent: security
    evidence_paths:
      - docs/compliance/iso/ISO-27001/statement-of-applicability.md
    check_type: record
    target_maturity: L2

  - id: CTL-27001-A.5.1
    title: 情報セキュリティポリシー
    domain: security
    iso_refs:
      - { standard: ISO-27001, clause: "A.5.1" }
    reg_refs:
      - { reg_id: REG-009, articles: ["第3条"] }
    primary_agent: security
    secondary_agents: [compliance]
    evidence_paths:
      - docs/company/regulations/joho-security-kanri-kisoku.md
    check_type: policy
    target_maturity: L2

  - id: CTL-27001-A.5.10
    title: 情報の分類
    domain: security
    iso_refs:
      - { standard: ISO-27001, clause: "A.5.10" }
    reg_refs:
      - { reg_id: REG-007, articles: ["第5条"] }
    primary_agent: security
    secondary_agents: [compliance]
    evidence_paths:
      - data/classification-registry.yaml
    check_type: operation
    target_maturity: L2

  - id: CTL-27001-A.8.1
    title: ユーザー端末 · アクセス
    domain: security
    iso_refs:
      - { standard: ISO-27001, clause: "A.8.1" }
    reg_refs:
      - { reg_id: REG-009, articles: ["第6条"] }
    primary_agent: security
    secondary_agents: [devops]
    evidence_paths:
      - docs/compliance/iso/ISO-27001/operations-log.md
    check_type: record
    target_maturity: L2

  - id: CTL-CORE-privacy
    title: 個人情報保護統制
    domain: privacy
    iso_refs:
      - { standard: ISO-27001, clause: "A.5.34" }
    reg_refs:
      - { reg_id: REG-010, articles: ["第3条", "第4条"] }
    primary_agent: privacy_officer
    secondary_agents: [compliance, security]
    evidence_paths:
      - docs/company/regulations/kojin-joho-hogo-kisoku.md
      - docs/compliance/privacy/
    check_type: policy
    target_maturity: L2

  - id: CTL-27001-9.2
    title: 内部監査（ISMS）
    domain: audit
    iso_refs:
      - { standard: ISO-27001, clause: "9.2" }
    reg_refs:
      - { reg_id: REG-016, articles: ["第4条"] }
    primary_agent: internal_audit
    secondary_agents: [security, compliance]
    evidence_paths:
      - docs/compliance/iso/internal-audit-plan-fy2026.md
      - docs/compliance/iso/audit-records/**/*
    check_type: record
    target_maturity: L3

  - id: CTL-27001-9.3
    title: マネジメントレビュー（ISMS）
    domain: audit
    iso_refs:
      - { standard: ISO-27001, clause: "9.3" }
    reg_refs:
      - { reg_id: REG-016, articles: ["第7条"] }
    primary_agent: compliance
    secondary_agents: [security]
    evidence_paths:
      - docs/compliance/iso/management-review-fy2026-template.md
    check_type: record
    target_maturity: L3
