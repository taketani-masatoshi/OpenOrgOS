version: "1"
standard: ISO-27001
notes: HLS 共通統制は core/ に集約。ここには Annex A と 27001 固有の方法（SoA）だけを置く。
core_bindings:
  - work: scope
    clause: "4.1"
    evidence_paths: [docs/company/regulations/joho-security-kanri-kisoku.md]
    reg_refs:
      - { reg_id: REG-009, articles: ["第2条"] }
  - work: policy
    clause: "5.2"
    evidence_paths: [docs/company/regulations/joho-security-kanri-kisoku.md]
    reg_refs:
      - { reg_id: REG-009, articles: ["第3条"] }
  - work: risk_approach
    clause: "6.1.2"
    evidence_paths: [docs/compliance/iso/ISO-27001/risk-register.csv]
    reg_refs:
      - { reg_id: REG-009, articles: ["第4条"] }
  - work: competence
    clause: "7.2"
    evidence_paths: [docs/company/regulations/joho-security-kanri-kisoku.md]
    reg_refs:
      - { reg_id: REG-009, articles: ["第5条"] }
  - work: documented_information
    clause: "7.5"
    reg_refs:
      - { reg_id: REG-007, articles: ["第4条の2"] }
  - work: internal_audit
    clause: "9.2"
    reg_refs:
      - { reg_id: REG-016, articles: ["第4条"] }
  - work: management_review
    clause: "9.3"
    reg_refs:
      - { reg_id: REG-016, articles: ["第7条"] }
controls:
  - id: CTL-27001-6.2
    title: リスク対応 · 統制選択（適用宣言書）
    domain: security
    iso_refs:
      - { standard: ISO-27001, clause: "6.1.3" }
    reg_refs:
      - { reg_id: REG-009, articles: ["第4条"] }
    primary_agent: security
    evidence_paths:
      - docs/compliance/iso/ISO-27001/statement-of-applicability.md
    check_type: record
    target_maturity: L2

  - id: CTL-27001-A.5.1
    title: 情報セキュリティポリシー
    domain: security
    iso_refs:
      - { standard: ISO-27001, clause: "A.5.1" }
    reg_refs:
      - { reg_id: REG-009, articles: ["第3条"] }
    primary_agent: security
    secondary_agents: [compliance]
    evidence_paths:
      - docs/company/regulations/joho-security-kanri-kisoku.md
    check_type: policy
    target_maturity: L2

  - id: CTL-27001-A.5.10
    title: 情報の分類
    domain: security
    iso_refs:
      - { standard: ISO-27001, clause: "A.5.10" }
    reg_refs:
      - { reg_id: REG-007, articles: ["第5条"] }
    primary_agent: security
    secondary_agents: [compliance]
    evidence_paths:
      - data/classification-registry.yaml
    check_type: operation
    target_maturity: L2

  - id: CTL-27001-A.8.1
    title: ユーザー端末 · アクセス
    domain: security
    iso_refs:
      - { standard: ISO-27001, clause: "A.8.1" }
    reg_refs:
      - { reg_id: REG-009, articles: ["第6条"] }
    primary_agent: security
    secondary_agents: [devops]
    evidence_paths:
      - docs/compliance/iso/ISO-27001/operations-log.md
    check_type: record
    target_maturity: L2

  # Legacy id kept deliberately: privacy is not a shared MS work, but the id
  # predates the core pack and carries tenant maturity history.
  - id: CTL-CORE-privacy
    title: 個人情報保護統制
    domain: privacy
    iso_refs:
      - { standard: ISO-27001, clause: "A.5.34" }
    reg_refs:
      - { reg_id: REG-010, articles: ["第3条", "第4条"] }
    primary_agent: privacy_officer
    secondary_agents: [compliance, security]
    evidence_paths:
      - docs/company/regulations/kojin-joho-hogo-kisoku.md
      - docs/compliance/privacy/
    check_type: policy
    target_maturity: L2
