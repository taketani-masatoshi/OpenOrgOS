version: "1"
standard: ISO-14001
notes: 環境。HLS 共通統制は core/。固有は環境側面・順守義務・緊急事態・順守評価。
core_bindings:
  - work: scope
    clause: "4.1"
  - work: policy
    clause: "5.2"
  - work: risk_approach
    clause: "6.1"
  - work: objectives_monitoring
    clause: "6.2"
  - work: objectives_monitoring
    clause: "9.1"
  - work: competence
    clause: "7.2"
  - work: documented_information
    clause: "7.5"
  - work: operation
    clause: "8.1"
  - work: internal_audit
    clause: "9.2"
  - work: management_review
    clause: "9.3"
  - work: corrective_action
    clause: "10.2"
controls:
  - id: CTL-14001-6.1.2
    title: 環境側面及び著しい側面の決定
    domain: environment
    iso_refs:
      - { standard: ISO-14001, clause: "6.1.2" }
    primary_agent: esg_sustainability
    secondary_agents: [operations]
    evidence_paths:
      - docs/compliance/iso/ISO-14001/environmental-aspects.csv
    check_type: record
    target_maturity: L2

  - id: CTL-14001-6.1.3
    title: 順守義務（法令・その他要求事項）
    domain: environment
    iso_refs:
      - { standard: ISO-14001, clause: "6.1.3" }
    primary_agent: esg_sustainability
    secondary_agents: [compliance, legal]
    evidence_paths:
      - docs/compliance/iso/ISO-14001/compliance-obligations.csv
    check_type: record
    target_maturity: L2

  - id: CTL-14001-8.2
    title: 緊急事態への準備及び対応
    domain: environment
    iso_refs:
      - { standard: ISO-14001, clause: "8.2" }
    primary_agent: esg_sustainability
    secondary_agents: [general_affairs, operations]
    evidence_paths:
      - docs/compliance/iso/ISO-14001/emergency-preparedness.md
    check_type: operation
    target_maturity: L2

  - id: CTL-14001-9.1.2
    title: 順守評価
    domain: environment
    iso_refs:
      - { standard: ISO-14001, clause: "9.1.2" }
    primary_agent: compliance
    secondary_agents: [esg_sustainability]
    evidence_paths:
      - docs/compliance/iso/ISO-14001/compliance-evaluation.md
    check_type: record
    target_maturity: L3
