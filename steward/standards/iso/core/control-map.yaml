    title: 適用範囲及び組織の状況
    work: scope
    domain: compliance_ms
    primary_agent: compliance
    secondary_agents: [executive_steward]
    evidence_paths: []
    evidence_mode: all
    check_type: policy
    target_maturity: L2
    priority: P2
    supersedes:
      - CTL-9001-4.3
      - CTL-27001-4.1
      - CTL-21401-4.1
      - CTL-13485-4.1
      - CTL-14001-4-1
      - CTL-20000-4-1
      - CTL-22000-4-1
