# Core management-system controls — shared across every enabled standard.
# Keyed by work type, not clause number: the same work is 9.2 under Annex SL,
# 8.2.4 under ISO 13485, and renumbered again on each revision.
# Clause numbers live in each pack's `core_bindings`.
version: "1"
controls:
