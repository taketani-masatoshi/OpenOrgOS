version: "1"
standard: ISO-13485
notes: |
  ISO 13485 は HLS 以前の構成。共通統制の条項番号は Annex SL と違う（内部監査 8.2.4 ·
  MR 5.6 · 力量 6.2 · 文書 4.2.4 · リスク 7.1）。core_bindings がその差を吸収する。
core_bindings:
  - work: scope
    clause: "4.1"
    evidence_paths: [docs/medical-device/qms/]
    reg_refs:
      - { reg_id: REG-025, articles: ["第1条"] }
  - work: policy
    clause: "5.3"
    evidence_paths: [docs/medical-device/qms/]
  - work: risk_approach
    clause: "7.1"
    evidence_paths: [docs/medical-device/qms/]
  - work: competence
    clause: "6.2"
    evidence_paths: [data/medical-device/ledgers/training-records.yaml]
  - work: documented_information
    clause: "4.2.4"
    evidence_paths: [data/medical-device/ledgers/document-control-records.yaml]
    reg_refs:
      - { reg_id: REG-025, articles: ["第3条"] }
      - { reg_id: REG-007, articles: ["第4条の2"] }
  - work: internal_audit
    clause: "8.2.4"
    evidence_paths: [docs/compliance/iso/ISO-13485/]
  - work: management_review
    clause: "5.6"
    evidence_paths: [docs/medical-device/qms/]
  - work: corrective_action
    clause: "8.5.2"
    evidence_paths: [docs/medical-device/qms/]
  - work: corrective_action
    clause: "8.5.3"
    evidence_paths: [docs/medical-device/qms/]
controls:
  - id: CTL-13485-4.2.2
    title: 品質マニュアル
    domain: quality
    iso_refs:
      - { standard: ISO-13485, clause: "4.2.2" }
    reg_refs:
      - { reg_id: REG-025, articles: ["第2条"] }
    primary_agent: medical_device_regulatory
    evidence_paths:
      - docs/medical-device/qms/
    check_type: policy
    target_maturity: L2

  - id: CTL-13485-7.3
    title: 設計・開発
    domain: quality
    iso_refs:
      - { standard: ISO-13485, clause: "7.3" }
    primary_agent: engineering
    secondary_agents: [medical_device_regulatory]
    evidence_paths:
      - docs/medical-device/qms/
    check_type: record
    target_maturity: L2

  - id: CTL-13485-7.4
    title: 購買
    domain: quality
    iso_refs:
      - { standard: ISO-13485, clause: "7.4" }
    primary_agent: medical_device_regulatory
    secondary_agents: [procurement]
    evidence_paths:
      - docs/medical-device/qms/
    check_type: operation
    target_maturity: L2

  - id: CTL-13485-7.5
    title: 製造及びサービス提供
    domain: quality
    iso_refs:
      - { standard: ISO-13485, clause: "7.5" }
    primary_agent: medical_device_regulatory
    secondary_agents: [quality_assurance, operations]
    evidence_paths:
      - data/medical-device/ledgers/manufacturing-batch-records.yaml
    check_type: record
    target_maturity: L2

  - id: CTL-13485-7.5.9
    title: トレーサビリティ
    domain: quality
    iso_refs:
      - { standard: ISO-13485, clause: "7.5.9" }
    primary_agent: medical_device_regulatory
    evidence_paths:
      - data/medical-device/ledgers/distribution-records.yaml
    check_type: record
    target_maturity: L2

  - id: CTL-13485-8.2.2
    title: 苦情処理
    domain: quality
    iso_refs:
      - { standard: ISO-13485, clause: "8.2.2" }
    reg_refs:
      - { reg_id: REG-026, articles: ["第2条"] }
    primary_agent: medical_device_regulatory
    evidence_paths:
      - data/medical-device/ledgers/complaint-records.yaml
    check_type: record
    target_maturity: L2

  - id: CTL-13485-8.2.3
    title: 規制当局への報告
    domain: quality
    iso_refs:
      - { standard: ISO-13485, clause: "8.2.3" }
    reg_refs:
      - { reg_id: REG-026, articles: ["第4条"] }
    primary_agent: medical_device_regulatory
    secondary_agents: [compliance]
    evidence_paths:
      - data/medical-device/ledgers/adverse-event-records.yaml
    check_type: record
    target_maturity: L3
