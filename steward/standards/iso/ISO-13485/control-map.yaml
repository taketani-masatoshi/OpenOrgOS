version: "1"
standard: ISO-13485
controls:
  - id: CTL-13485-4.1
    title: QMS 一般要求事項
    domain: quality
    iso_refs:
      - { standard: ISO-13485, clause: "4.1" }
    reg_refs:
      - { reg_id: REG-025, articles: ["第1条"] }
    primary_agent: medical_device_regulatory
    secondary_agents: [compliance, quality_assurance]
    evidence_paths:
      - docs/medical-device/qms/
    check_type: policy
    target_maturity: L2

