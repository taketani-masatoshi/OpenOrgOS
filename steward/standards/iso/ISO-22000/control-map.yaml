version: "1"
standard: ISO-22000
notes: 食品安全。HLS 共通統制は core/。固有は PRP・HACCP・トレーサビリティ・リコール。
core_bindings:
  - work: scope
    clause: "4.1"
  - work: policy
    clause: "5.2"
  - work: risk_approach
    clause: "6.1"
  - work: objectives_monitoring
    clause: "6.2"
  - work: objectives_monitoring
    clause: "9.1"
  - work: competence
    clause: "7.2"
  - work: documented_information
    clause: "7.5"
  - work: operation
    clause: "8.1"
  - work: internal_audit
    clause: "9.2"
  - work: management_review
    clause: "9.3"
  - work: corrective_action
    clause: "10.2"
controls:
  - id: CTL-22000-8.2
    title: 前提条件プログラム（PRP）
    domain: quality
    iso_refs:
      - { standard: ISO-22000, clause: "8.2" }
    primary_agent: operations
    secondary_agents: [quality_assurance]
    evidence_paths:
      - docs/compliance/iso/ISO-22000/prerequisite-programmes.md
    check_type: policy
    target_maturity: L2

  - id: CTL-22000-8.5.2
    title: ハザード分析及び CCP の決定
    domain: quality
    iso_refs:
      - { standard: ISO-22000, clause: "8.5.2" }
    primary_agent: quality_assurance
    secondary_agents: [operations]
    evidence_paths:
      - docs/compliance/iso/ISO-22000/hazard-analysis.csv
    check_type: record
    target_maturity: L2

  - id: CTL-22000-8.5.4
    title: ハザード管理プラン（HACCP/OPRP）
    domain: quality
    iso_refs:
      - { standard: ISO-22000, clause: "8.5.4" }
    primary_agent: quality_assurance
    secondary_agents: [operations]
    evidence_paths:
      - docs/compliance/iso/ISO-22000/haccp-plan.md
    check_type: operation
    target_maturity: L2

  - id: CTL-22000-8.3
    title: トレーサビリティシステム
    domain: quality
    iso_refs:
      - { standard: ISO-22000, clause: "8.3" }
    primary_agent: operations
    secondary_agents: [quality_assurance]
    evidence_paths:
      - docs/compliance/iso/ISO-22000/traceability-records/
    check_type: record
    target_maturity: L2

  - id: CTL-22000-8.9.5
    title: 回収・リコール
    domain: quality
    iso_refs:
      - { standard: ISO-22000, clause: "8.9.5" }
    primary_agent: quality_assurance
    secondary_agents: [operations, pr_communications]
    evidence_paths:
      - docs/compliance/iso/ISO-22000/withdrawal-procedure.md
    check_type: record
    target_maturity: L3
