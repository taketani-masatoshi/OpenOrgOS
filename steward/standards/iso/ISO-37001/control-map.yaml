version: "1"
standard: ISO-37001
notes: 贈収賄防止。HLS 共通統制は core/。固有は贈収賄リスク評価・DD・贈答・通報・調査。
core_bindings:
  - work: scope
    clause: "4.1"
  - work: policy
    clause: "5.2"
  - work: risk_approach
    clause: "6.1"
  - work: objectives_monitoring
    clause: "6.2"
  - work: objectives_monitoring
    clause: "9.1"
  - work: competence
    clause: "7.2"
  - work: documented_information
    clause: "7.5"
  - work: operation
    clause: "8.1"
  - work: internal_audit
    clause: "9.2"
  - work: management_review
    clause: "9.3"
  - work: corrective_action
    clause: "10.2"
controls:
  - id: CTL-37001-4.5
    title: 贈収賄リスク評価
    domain: compliance_ms
    iso_refs:
      - { standard: ISO-37001, clause: "4.5" }
    primary_agent: compliance
    secondary_agents: [legal, internal_audit]
    evidence_paths:
      - docs/compliance/iso/ISO-37001/bribery-risk-assessment.csv
    check_type: record
    target_maturity: L2

  - id: CTL-37001-8.2
    title: 取引先デューデリジェンス
    domain: compliance_ms
    iso_refs:
      - { standard: ISO-37001, clause: "8.2" }
    primary_agent: compliance
    secondary_agents: [procurement, legal]
    evidence_paths:
      - docs/compliance/iso/ISO-37001/due-diligence-records/
    check_type: record
    target_maturity: L2

  - id: CTL-37001-8.7
    title: 贈答・接待・寄附の管理
    domain: compliance_ms
    iso_refs:
      - { standard: ISO-37001, clause: "8.7" }
    primary_agent: compliance
    secondary_agents: [finance]
    evidence_paths:
      - docs/company/regulations/riekisohan-torihiki-kisoku.md
    check_type: policy
    target_maturity: L2

  - id: CTL-37001-8.9
    title: 通報窓口（内部通報）
    domain: compliance_ms
    iso_refs:
      - { standard: ISO-37001, clause: "8.9" }
    primary_agent: compliance
    secondary_agents: [legal, human_resources]
    evidence_paths:
      - docs/compliance/iso/ISO-37001/whistleblowing-procedure.md
    check_type: policy
    target_maturity: L3

  - id: CTL-37001-8.10
    title: 疑義の調査及び対応
    domain: compliance_ms
    iso_refs:
      - { standard: ISO-37001, clause: "8.10" }
    primary_agent: internal_audit
    secondary_agents: [compliance, legal]
    evidence_paths:
      - docs/compliance/iso/ISO-37001/investigation-records/
    check_type: record
    target_maturity: L3
