id: field_ops
activation_seeds:
  - jobs.example.yaml
  - staff.example.yaml
notes: activation_ready — dispatch and job completion are proposals. GPS traces are not stored
cli_commands:
  - show
  - validate
  - dispatch
  - job
  - analytics
security:
  ai:
    can_observe: true
    can_analyze: true
    can_draft: true
    can_propose: true
    can_approve: false
    can_execute: false
  limits:
    concurrent_jobs: 2
