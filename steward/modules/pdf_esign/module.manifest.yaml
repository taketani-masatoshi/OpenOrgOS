id: pdf_esign
activation_seeds:
  - national-eid.example.yaml
  - digidoc.example.yaml
cli_commands:
  - ready
  - endpoints
  - list
  - create
  - prepare
  - send
  - attach-container
  - verify-digidoc
  - accept-live
notes: activation_ready — 国民 eID 署名（DigiDoc · SiVa）。署名は本人のカードで行う
security:
  ai:
    can_observe: true
    can_analyze: true
    can_draft: true
    can_propose: true
    can_approve: false
    can_execute: false
  limits:
    concurrent_jobs: 2
