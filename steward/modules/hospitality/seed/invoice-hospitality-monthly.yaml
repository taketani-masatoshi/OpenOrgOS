id: hospitality-monthly
module: hospitality
description: 月次宿泊料請求（PDF + メール文案 + EML/MSG）

pdf:
  title: "請 求 書"
  line_label: "{year_month}分 宿泊料（{property_name}）"
  line_note: "宿泊サービス（消費税課税 10%）"
  tax_label: "消費税（10%）"
  tax_note: "宿泊料金は課税10%"
  tax_mode: taxable_10
  lodging_tax_label: "宿泊税（都条例）"
