    ・振込手数料は貴社にてご負担ください。
    ・宿泊税は都条例に基づき特別徴収（本請求書に含む場合は明細行参照）。
    ・ご入金確認後、領収書が必要な場合はお申し付けください。

email:
  subject: "【ご請求】{property_name} {year_month}分宿泊料"
