id: client_portal
activation_seeds:
  - grant.example.yaml
notes: activation_ready — view links show contract id, invoice id, and order status. No document body
cli_commands:
  - show
  - validate
  - grant
  - track
security:
  ai:
    can_observe: true
    can_analyze: true
    can_draft: true
    can_propose: true
    can_approve: false
    can_execute: false
  limits:
    concurrent_jobs: 2
