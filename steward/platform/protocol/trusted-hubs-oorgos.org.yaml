# ── 最終系（正本 · 2026-07-06）────────────────────────────────────────────
final_plan:
  notes: |
    Authoritative regional witness chapter rollout (witness-hub-governance.md §7.B).
    Changes vs provisional: +Ireland (Dublin HUB-EU-IE), +Turkey (Istanbul HUB-TR-IST),
    -Frankfurt (HUB-EU-FRA). Global n=8 · k=3 at Phase 5.
    hub_public_key: REPLACE_AFTER hub export-public-key per operator.
  quorum:
    mode: k_of_n
    k: 3
  hubs:
    - hub_id: HUB-APAC-JP
      city: Tokyo
      wave: 1
      role: thin_apac_chapter
      hub_url: https://hub-apac.oorgos.org
      hub_public_key: REPLACE_AFTER_hub_export_public_key
      priority: 1
    - hub_id: HUB-ME
      city: Dubai
      wave: 1
      hub_url: https://hub-me.oorgos.org
      hub_public_key: TBD_DIFC_OPERATOR
      priority: 2
    - hub_id: HUB-EU-EE
      city: Tallinn
      wave: 1
      role: global_hq_treasury
      hub_url: https://hub-eu-ee.oorgos.org
      hub_public_key: TBD_ESTONIA_OU
      priority: 3
      notes: OpenOrgOS OÜ Treasury; OpenOrgOS Fund OÜ/AS at Wave 2 (separate legal entity)
    - hub_id: HUB-EU-IE
      city: Dublin
      country: Ireland
      wave: 2
      role: eu_witness
      hub_url: https://hub-eu-ie.oorgos.org
      hub_public_key: TBD_IRELAND_OPERATOR
      priority: 4
      notes: Replaces provisional HUB-EU-FRA (Frankfurt)
    - hub_id: HUB-TR-IST
      city: Istanbul
      country: Turkey
      wave: 3
      role: eurasia_bridge
      hub_url: https://hub-tr-ist.oorgos.org
      hub_public_key: TBD_TURKEY_OPERATOR
      priority: 5
      notes: Promoted from transit-only in provisional plan; Star Alliance TK
    - hub_id: HUB-US
      city: New York
      wave: 3
      hub_url: https://hub-us.oorgos.org
      hub_public_key: TBD_US_OPERATOR
      priority: 6
    - hub_id: HUB-SA
      city: Santiago
      wave: 3
      hub_url: https://hub-sa.oorgos.org
      hub_public_key: TBD_SA_OPERATOR
      priority: 7
    - hub_id: HUB-OCEANIA-NZ
      city: Auckland
      wave: 5
      succession_trust_wave: 2
      hub_url: https://hub-oceania.oorgos.org
      hub_public_key: TBD_NZ_CHARITABLE_TRUST
      priority: 8

