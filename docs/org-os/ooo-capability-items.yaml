# OOO 可否表の採点正本。
#
# 採点は `npm run ooo:score`（scripts/ooo-score.ts）が実際の tests / e2e /
# playwright config を走査して算出する。手で点は書かない。
#
# 100 = spec 20 + impl 30 + test 30 + verify 20。4軸すべて証跡から算出する。
#   spec   ... docs 実在 8 + mentions 命中 4 点 ×最大3
#   impl   ... sources 実在 6 + 権限ガード 6 + 入力検証 6 + 例外封じ込め 6 + 拒否テスト 6
#   test   ... unit（厚10 / 薄5 / 無0）+ http 8 + e2e（緑12 / 登録のみ3 / 未登録1 / 無0）
#   verify ... e2e が config に登録され CI で再現可能なら 20、部分 8、それ以外 0
#
# spec.docs     ... その行為の仕様文書。docs/org-os/ooo-surfaces/ 配下
# spec.mentions ... 文書が必ず含む文字列。慣例として「経路 · 必要権限 · 拒否条件」の3つ
# impl.sources  ... その行為を実際に担うソース。ガードはここを走査して検出する
# unit          ... その行為の分岐・失敗系を押さえる tests/*.test.ts（2本以上で「厚」）
# http          ... BFF を HTTP で叩くテスト。route はそのテストが実際に触る経路の一部
# e2e           ... spec ファイル名。playwright config の testMatch に載っていなければ減点
