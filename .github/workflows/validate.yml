name: validate

on:
  push:
    branches: [main, master, "cursor/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx tsc --noEmit
      - run: npm test
  orgos-demos:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run demo:standalone-org
      - run: npm run demo:mal-standalone
      - run: npm run validate:protocol:tenants
