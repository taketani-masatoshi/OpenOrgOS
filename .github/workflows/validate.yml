name: validate

on:
  push:
    branches: [main, master, "cursor/**"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check:tenant-tip
      - run: npm run generated:check
      - run: npm run agent:pipeline:check
      # Pin the tenant so gates never fall back to an operator's real tenant / missing local payroll.
      - run: npm run check
        env:
          ORGOS_TENANT: demo
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:registry:sync
      - run: git diff --exit-code tests/test-registry.yaml
      - run: npm run test:registry:check
      - run: npm run test:tiered:verify
      - run: npm run test:contract
      - run: npm run test:finance
      - run: ORGOS_TENANT=_fixture-books FINANCE_LOOP_ROUNDS=1 bash scripts/finance-accuracy-loops.sh
      - run: '/usr/bin/time -f "npm test elapsed: %E" npm test'
  console-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run steward-chat:typecheck
      - run: npm run steward-chat:build
  security-rbac:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: >
          npm test --
          tests/operator-rbac.test.ts
          tests/cli-operator-auth.test.ts
          tests/mcp-rbac.test.ts
          tests/org-boundary.test.ts
          tests/shell-sandbox.test.ts
          tests/prod-auth-checklist.test.ts
          tests/prod-startup.test.ts
          tests/passkey-bootstrap-http.test.ts
          tests/passkey-prod-readiness.test.ts
          tests/webauthn-register-gate.test.ts
          tests/security-validate.test.ts
          tests/cli-data-write-auth.test.ts
          tests/tenant-registry-coverage.test.ts
          tests/shell-profile-integrity.test.ts
  orgos-demos:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run demo:standalone-org
      - run: npm run demo:mal-standalone
      - run: npm run validate:protocol:tenants
  wire-console-smoke:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run wire-console:build
      - run: playwright test e2e/wire-console.smoke.spec.ts
        env:
          WIRE_CONSOLE_SMOKE_PORT: "9472"
      - run: playwright test e2e/wire-console-webauthn.smoke.spec.ts --config=playwright.webauthn.config.ts
        env:
          WIRE_CONSOLE_WEBAUTHN_SMOKE_PORT: "9473"
      - run: playwright test e2e/wire-console-oidc.smoke.spec.ts --config=playwright.oidc.config.ts
        env:
          WIRE_CONSOLE_OIDC_SMOKE_PORT: "9474"
      - run: npm run wire-console:release-check
  steward-chat-smoke:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run steward-chat:smoke
      - run: npx playwright install --with-deps chromium
      - run: npm run steward-chat:build
      - run: npm run steward-chat:e2e
        env:
          STEWARD_CHAT_SMOKE_PORT: "9475"
      - run: npm run steward-chat:webauthn-e2e
        env:
          STEWARD_CHAT_WEBAUTHN_SMOKE_PORT: "9477"
  passkey-ui-smoke:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run passkey:ui-smoke
        env:
          STEWARD_CHAT_WEBAUTHN_SMOKE_PORT: "9477"
          WIRE_CONSOLE_WEBAUTHN_SMOKE_PORT: "9473"
          WIRE_CONSOLE_WEBAUTHN_BOOTSTRAP_SMOKE_PORT: "9478"
  package-publish-check:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run package:publish-check
  operator-console-e2e:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run operator-console:e2e
        env:
          OPERATOR_CONSOLE_SMOKE_PORT: "9476"
  test-docker:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/test/docker-compose.yaml build test
      - run: docker compose -f deploy/test/docker-compose.yaml run --rm test npm test -- tests/protocol-relay-org-c.test.ts tests/protocol-api-tls.test.ts
  wire-gateway-smoke:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: >
          npm test --
          tests/wire-gateway-server.test.ts
          tests/wire-gateway-codec.test.ts
          tests/wire-gateway-outbound-e2e.test.ts
          tests/wire-gateway-validate.test.ts
          tests/wire-gateway-internal-api.test.ts
          tests/wire-gateway-init.test.ts
          tests/wire-gateway-discover.test.ts
          tests/wire-gateway-discover-apply.test.ts
          tests/outbox-permissions-gate.test.ts
          tests/wire-trust-registry.test.ts
          tests/wire-trust-registry-sync.test.ts
          tests/wire-trust-registry-governance.test.ts
          tests/wire-node-pk-did-governance.test.ts
          tests/peers-migrate-legacy.test.ts
          tests/gov-gateway-adapter.test.ts
          tests/gov-gateway-sandbox.test.ts
          tests/gov-gateway-live.test.ts
          tests/prod-wire-gate.test.ts
          tests/mal-wire-pilot-gate.test.ts
          tests/mal-wire-peer-deliver.test.ts
          tests/mal-peers-trust-registry.test.ts
          tests/wire-relay-e2e.test.ts
          tests/wire-gateway-federation-sync.test.ts
          tests/relay-sla-alert.test.ts
          tests/protocol-relay-worker.test.ts
          tests/protocol-witness-integration.test.ts
      - run: docker compose -f deploy/wire-gateway/docker-compose.yaml config
      - run: ORGOS_STRICT_TRANSPORT=1 npm run validate:protocol:tenants
  community-protocol:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run orgos -- protocol community operators-validate
      - run: npm run orgos -- protocol community check-sla
      - run: npm run orgos -- protocol community export
      - run: >
          npm test --
          tests/trusted-operators.test.ts
          tests/community-readiness.test.ts
          tests/eco-production-evidence.test.ts

  etax-certification:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: >
          npm test --
          tests/etax-certification.test.ts
          tests/etax-lifecycle-e2e.test.ts
          tests/etax-phase4-8.test.ts
          tests/catalog/jp-etax.test.ts

  efiling-implementation-score:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: >
          npm test --
          tests/efiling-implementation-100.test.ts
          tests/efiling-core.test.ts
          tests/efiling-recovery.test.ts
          tests/efiling-amendment.test.ts
          tests/efiling-evidence.test.ts
          tests/efiling-secrets.test.ts
          tests/efiling-production-gate.test.ts
          tests/etax-form-hoa110.test.ts
          tests/etax-accounting-bridge.test.ts
          tests/eltax-lifecycle.test.ts
      - name: Write mechanism score
        run: npm run orgos -- efiling score --json > efiling-score.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: efiling-implementation-score
          path: efiling-score.json

  etax-xsd-vendor:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Fetch KSK2 CABs (dispatch only, not on pull requests)
        run: npm run orgos -- etax spec fetch
      - run: npm test -- tests/etax-form-hoa110.test.ts tests/etax-lifecycle-e2e.test.ts

  etax-host-windows-smoke:
    runs-on: windows-latest
    continue-on-error: true
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Stub etax-host health (no NTA COM in CI)
        shell: bash
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"health"}' | ORGOS_ETAX_HOST_MODE=stub node tools/etax-host/etax-host.mjs | head -1
      - run: npm test -- tests/etax-certification.test.ts
        env:
          ORGOS_ETAX_HOST_MODE: stub

  etax-d18-acceptance:
    # B-layer only: NOT part of normal PR CI. Success here means tip D1–D8;
    # job absence / skip must never be read as “e-Tax accepted”.
    # Triggers: workflow_dispatch, or PR label `etax-acceptance` (plan §2.1).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(join(github.event.pull_request.labels.*.name, ','), 'etax-acceptance'))
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: B-layer D1–D8 tip acceptance (operator-complete only)
        run: npm test -- tests/etax-d1-d8-acceptance.test.ts
        env:
          ETAX_D18_ACCEPTANCE: "1"
