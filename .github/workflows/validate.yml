name: validate

on:
  push:
    branches: [main, master, "cursor/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx tsc --noEmit
      - run: npm test
  orgos-demos:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run demo:standalone-org
      - run: npm run demo:mal-standalone
      - run: npm run validate:protocol:tenants
  wire-console-smoke:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run wire-console:build
      - run: playwright test e2e/wire-console.smoke.spec.ts
        env:
          WIRE_CONSOLE_SMOKE_PORT: "9472"
      - run: playwright test e2e/wire-console-webauthn.smoke.spec.ts --config=playwright.webauthn.config.ts
        env:
          WIRE_CONSOLE_WEBAUTHN_SMOKE_PORT: "9473"
      - run: playwright test e2e/wire-console-oidc.smoke.spec.ts --config=playwright.oidc.config.ts
        env:
          WIRE_CONSOLE_OIDC_SMOKE_PORT: "9474"
