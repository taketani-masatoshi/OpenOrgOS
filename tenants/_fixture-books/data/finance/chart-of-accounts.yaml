# 勘定科目（最小セット）— 複式簿記・申告書対応の科目コード
# 会計方針: docs/finance/accounting-policy.md

version: "1"
currency: JPY

accounts:
  # 資産
  - code: "1100"
    name: 現金及び預金
    type: asset
    normal_balance: debit
    data_source: data/finance/cash-balance.yaml
  - code: "1200"
    name: 建物
    type: asset
    normal_balance: debit
    data_source: data/finance/fixed-assets.yaml
    filter: category=建物
  - code: "1210"
    name: 土地
    type: asset
    normal_balance: debit
    data_source: data/finance/fixed-assets.yaml
    filter: category=土地
  - code: "1290"
    name: 減価償却累計額
    type: asset_contra
    normal_balance: credit
    data_source: data/finance/fixed-assets.yaml
    field: accumulated_depreciation
  - code: "1150"
    name: 売掛金
    type: asset
    normal_balance: debit
    note: 請求発行・入金消込の AR 科目
  - code: "1300"
    name: 役員貸付金
    type: asset
    normal_balance: debit
    data_source: data/finance/loans.yaml
    note: 貸付対象者は負債科目（役員借入金）と相殺せず別管理（税理士確認）

  # 負債
  - code: "2100"
    name: 役員借入金
    type: liability
    normal_balance: credit
    data_source: data/finance/loans.yaml
    note: 無利息役員貸付 LOAN-001/002。みなし利息調整は tax-profile 参照
  - code: "2120"
    name: 預り金-源泉所得税
    type: liability
    normal_balance: credit
    note: 給与源泉徴収
  - code: "2130"
    name: 預り金-社会保険料
    type: liability
    normal_balance: credit
    note: 健保・厚年・雇用（労働者負担分）
  - code: "2140"
    name: 未払給与
    type: liability
    normal_balance: credit
    note: 給与支払未払
  - code: "2160"
    name: 仮受消費税
    type: liability
    normal_balance: credit
    note: 請求書発行時の消費税相当額
  - code: "2110"
    name: 買掛金
    type: liability
    normal_balance: credit
    note: 仕入・外注の AP 統制勘定
  - code: "2165"
    name: 宿泊税預り金
    type: liability
    normal_balance: credit
    note: 都条例に基づく宿泊税特別徴収
  - code: "2170"
    name: 仮払消費税
    type: asset
    normal_balance: debit
    note: 仕入税額（控除対象）

  # 純資産
  - code: "3100"
    name: 資本金
    type: equity
    normal_balance: credit
    data_source: data/finance/tax-profile.yaml
    field: corporate_tax.capital_stock
  - code: "3200"
    name: 繰越利益剰余金
    type: equity
    normal_balance: credit
    data_source: data/finance/tax-profile.yaml
    field: corporate_tax.prior_retained_earnings

  # 収益
  - code: "4100"
    name: 賃貸料収入
    type: revenue
    normal_balance: credit
    statement_section: revenue
    property_ids: [PROP-001]
  - code: "4200"
    name: 宿泊収入
    type: revenue
    normal_balance: credit
    statement_section: revenue
    property_ids: [PROP-002]
  - code: "4900"
    name: 雑収入
    type: revenue
    normal_balance: credit
    statement_section: revenue

  # 費用
  - code: "5100"
    name: 減価償却費
    type: expense
    normal_balance: debit
    statement_section: sga
    data_source: data/plans/expense-plan.yaml
    line_id: depreciation
  - code: "5200"
    name: 旅館運営費
    type: expense
    normal_balance: debit
    statement_section: sga
    property_ids: [PROP-002]
    budget_delegation: person
  - code: "5300"
    name: 役員報酬
    type: expense
    normal_balance: debit
    statement_section: sga
    data_source: data/finance/payroll.yaml
  - code: "5400"
    name: 業務委託費
    type: expense
    normal_balance: debit
    statement_section: sga
    contract_ids: [CTR-001]
  - code: "5500"
    name: 支払利息
    type: expense
    normal_balance: debit
    statement_section: non_operating_expense
    note: 現状 LOAN-001/002 は利率0%
  - code: "5600"
    name: 修繕費
    type: expense
    normal_balance: debit
    statement_section: sga
  - code: "5700"
    name: 通信費
    type: expense
    normal_balance: debit
    statement_section: sga
  - code: "5800"
    name: 保険料
    type: expense
    normal_balance: debit
    statement_section: sga
  - code: "5900"
    name: 雑費
    type: expense
    normal_balance: debit
    statement_section: sga
  - code: "8100"
    name: 法人税等
    type: expense
    normal_balance: debit
    statement_section: income_tax

category_mapping:
  revenue:
    rent: "4100"
    hotel_revenue: "4200"
    other_revenue: "4900"
  expense:
    repair: "5600"
    cleaning: "5200"
    management_fee: "5200"
    utilities: "5200"
    other_property: "5200"
    fixed_rent: "5200"
    communication: "5700"
    insurance: "5800"
    advisory: "5400"
    system: "5400"
    loan_payment: "2100"
    capex: "1200"
    depreciation: "5100"
    other: "5900"

journal_source_accounts:
  bank_control: "1100"
  accounts_receivable: "1150"
  accounts_payable: "2110"
  withholding_payable: "2120"
  social_insurance_payable: "2130"
  payroll_payable: "2140"
  payroll_expense: "5300"
  depreciation_expense: "5100"
  accumulated_depreciation: "1290"
  retained_earnings: "3200"
  consumption_tax_payable: "2160"
  consumption_tax_receivable: "2170"
  lodging_tax_payable: "2165"

notes: |
  本ファイルは Steward 正データの科目マッピング。仕訳・総勘定元帳は journal-entries.yaml + orgos ledger。
  人間可読ミラー: docs/finance/accounting/records/*.csv（会計 SaaS 非導入）。
  capex 発生時は investment-plan と fixed-assets を同時更新。
