# 業務モジュール — 雛形（架空: 株式会社サンプル商事）
# enabled: true のモジュールのみ Agent が有効化される

modules:
  - id: rental
    enabled: true
    agent: rental
    property_ids: [PROP-001]
    docs_root: docs/properties/PROP-001-minato/operations/
    summary_dir: agent-summaries/rental/
    notes: みなとビル501 賃貸（例）

  - id: hospitality
    enabled: false
    agent: hospitality
    property_ids: [PROP-002]
    docs_root: docs/properties/PROP-002-midori/operations/
    operations_public: data/operations/midori-public.yaml
    operations_secrets: data/operations/midori-secrets.yaml
    summary_dir: agent-summaries/hospitality/
    notes: 緑丘ゲストハウス（例 · 未開業なら enabled: false）

  - id: professional_services
    enabled: false
    agent: professional_services
    data_root: data/services/
    notes: 受託・サービス

  - id: venture_capital
    enabled: false
    agent: venture_capital
    data_root: data/venture-capital/
    docs_root: docs/venture-capital/
    summary_dir: agent-summaries/venture-capital/
    notes: サンプル・キャピタル（例 · `.example` をコピーして有効化）
