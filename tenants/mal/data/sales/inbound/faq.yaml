    subject_template: "【受付】{{subject}}"
    body_template: |
      {{company}} 様

      お問い合わせを受け付けました（参照: お問い合わせ ID はメールヘッダ／ポータル上でご確認ください）。
      内容を確認のうえ、担当よりご回答いたします。

      お急ぎの場合は、希望連絡手段のみ（本文・個人情報は改めてのご連絡で）お知らせください。

      株式会社MAL
