related_docs:
  - docs/company/tax/fy2026-tax-readiness-assessment.md
  - docs/company/tax/fy2026-tax-advisor-handoff.md
  - docs/company/tax/fy2026/01-hojinzei-shinkoku-yoko.md
  - docs/company/fy2026-tax-advisor-checklist.md
  - docs/finance/tax-filing-checklist.md
obligation_rhythms:
  - id: gensen-monthly
    kind: tax
    label: 源泉所得税納付
    cadence: month
    due_rule: next_month_day_10
    enabled: true
    apply_when: has_withholding
    amount:
      mode: formula
      formula: payroll_withholding_rough
    authority: 税務署
    cashflow_category: withholding
    note: 給与支払いの翌月10日（土日祝は翌営業日）
  - id: shaho-monthly
    kind: social
    label: 社会保険料納付
    cadence: month
    due_rule: end_of_month
    enabled: true
    apply_when: has_social_insurance
    amount:
      mode: formula
      formula: payroll_social_employer_rough
    authority: 年金事務所
    cashflow_category: social_insurance
  - id: nenmatsu
    kind: hr
    label: 年末調整
    cadence: annual
    due_rule: fixed_md
    month: 12
    day: 31
    enabled: true
    apply_when: has_withholding
    status_default: planned
  - id: hoteichousho
    kind: hr
    label: 法定調書提出
    cadence: annual
    due_rule: fixed_md
    month: 1
    day: 31
    enabled: true
    apply_when: has_withholding
    status_default: planned
  - id: kotei-shisanzei-quarter
    kind: tax
    label: 固定資産税
    cadence: custom
    due_rule: custom_mds
    custom_mds:
      - month: 6
        day: 1
      - month: 9
        day: 1
      - month: 12
        day: 1
      - month: 3
        day: 1
    enabled: true
    apply_when: has_fixed_assets
    amount:
      mode: formula
      formula: fixed_asset_quarter
    authority: 区市町村
    cashflow_category: property_tax
  - id: hojinzei-kokuzei-rhythm
    kind: tax
    label: 法人税（確定）
    cadence: annual
    due_rule: fiscal_plus_2_months
    enabled: true
    apply_when: always
    amount:
      mode: from_profile
      from_profile_path: corporate_tax.estimated_tax_fy2026
    authority: 国税庁（e-Tax）
    cashflow_category: corporate_tax
  - id: lodging-tax-monthly
    kind: tax
    label: 宿泊税
    cadence: month
    due_rule: end_of_month
    enabled: true
    apply_when: always
    amount:
      mode: from_ledger
      note: hospitality 宿泊税台帳（assessments）
    authority: 区市町村
    cashflow_category: lodging_tax
demo_confirmed_at: 2026-07-05
demo_note: |
  申告カレンダー・免税売上想定などはデモ由来が残る。 資本金・株主・顧問（税理士未契約・松尾剛行／桃尾・松尾・難波）は CEO確認 2026-08-29。
