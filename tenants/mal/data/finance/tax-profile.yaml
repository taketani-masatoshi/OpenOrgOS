entity:
  name: 株式会社MAL
  type: 株式会社
  corporate_number: "4010001189530"
  address: 〒102-0084 東京都千代田区二番町1
fiscal_year:
  end_month: 1
  label: 第9期
  period_from: 2026-02-01
  period_to: 2027-01-31
  calendar_note: 決算月1月。申告期限は原則決算日の翌日から2ヶ月以内
consumption_tax:
  status: 免税事業者
  options:
    - 課税事業者（本則）
    - 課税事業者（簡易課税）
    - 免税事業者
  invoice_registration_number: T4010001189530
  invoice_registered: true
  base_period_sales_jpy: 7500000
  base_period_sales_threshold: 10000000
  invoice_exempt_reconciled_basis: |
    基準期間課税売上750万円（第9期想定 sales 7,500,000円）・閾値1,000万円未満のため免税事業者を暫定選択。
    インボイス登録番号 T4010001189530 は取引先への登録番号表示義務に対応（法人番号ベース）。
    税理士確認依頼: fy2026-tax-advisor-checklist #10 · handoff 2026-08-24（暫定 — 確定後に更新）。
  notes: |
    デモ用確定（2026-07-05）: 第9期売上高750万円想定 · 基準期間1,000万円未満のため免税。
    インボイス登録番号は company.yaml に記載済み（免税でも登録番号は表示義務あり）。
    宿泊・賃貸の課税/非課税区分は実申告時に税理士確認。
corporate_tax:
  category: 中小法人
  applicable_rates:
    note: 資本金850万円 · 所得800万円以下部分 15% 想定（税理士最終確認）
  capital_stock: 8500000
  prior_retained_earnings: 5000000
  estimated_tax_fy2026: 775000
  estimated_tax_status: 暫定
  notes: >
    資本金850万円 · 発行100株は CEO確認 2026-08-29（実データ）。
    期首繰越利益剰余金+500万円は第8期社内再構成（税理士未契約・突合残）。

    期首繰越5,000,000円は第8期計算書類（docs/company/fy2025-keisansyorui.md · 2026-07-28
    社内再構成）と接続。

    役員貸付無利息（LOAN-001/002）— みなし利息・貸付金科目の税務処理は税理士確認。
local_tax:
  prefecture: 東京都
  fixed_asset_tax_annual_jpy: 120000
  municipalities:
    - name: 千代田区
      assets:
        - ASSET-001
      taxes:
        - 法人住民税
        - 固定資産税
    - name: 墨田区
      assets:
        - ASSET-002
        - ASSET-003
      taxes:
        - 法人住民税
        - 固定資産税
        - 事業所税
  notes: 法人住民税・事業税は法人税確定後に連動。均等割は資本金850万円想定
filing_calendar:
  - id: hojinzei-kokuzei
    tax: 法人税（国税）
    authority: 国税庁（e-Tax）
    deadline: 2027-03-31
    status: demo_confirmed
    attachments:
      - 別表16
      - 別表4
      - 勘定科目内訳明細書
  - id: shohizei
    tax: 消費税
    authority: 国税庁（e-Tax）
    deadline: 2027-03-31
    status: not_required
    note: 免税事業者 — 申告不要（デモ確定）
  - id: hojin-juminzei
    tax: 法人住民税・法人都民税
    authority: 東京都（eLTAX）
    deadline: 2027-03-31
    status: demo_confirmed
  - id: jigyozei
    tax: 法人事業税
    authority: 東京都（eLTAX）
    deadline: 2027-03-31
    status: demo_confirmed
  - id: kotei-shisanzei
    tax: 固定資産税（償却資産申告）
    authority: 千代田区・墨田区
    deadline: 2027-01-31
    status: demo_confirmed
    note: 毎年1/31申告。評価額は fixed-assets ダミー値参照
  - id: gensen-choutei
    tax: 源泉所得税・法定調書
    authority: 税務署
    deadline: 2027-01-31
    status: 該当（概算）
    note: 正社員2名は源泉対象（payroll.yaml）。役員報酬0。税理士未契約のため率・納付は未確定。
contacts:
