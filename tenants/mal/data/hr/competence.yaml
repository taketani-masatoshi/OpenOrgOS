  - employee_id: EMP-001
    competence_id: CMP-08
    level: 2
    assessed_on: "2026-08-29"
    basis: 墨田区亀沢の近隣挨拶・町会対応を実施
  - employee_id: EMP-001
    competence_id: CMP-09
    level: 1
    assessed_on: "2026-08-29"
    basis: ISO 21401 のギャップ分析に参加。内部監査の実施経験はない

  # --- EMP-002 宮城万貴子（代表取締役） ---
