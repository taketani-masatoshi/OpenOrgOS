# Steward OS — パラメータ依存関係グラフ
#
# 目的: 正データ（data/*.yaml）や関連 docs を編集したとき、
#       確認・同期が必要な下流項目を機械的に列挙する。
#
# 使い方:
#   npm run orgos -- deps check --file data/contracts/CTR-008.yaml
#   npm run orgos -- impact data/properties/PROP-002.yaml
#   npm run orgos -- deps graph
#   npm run validate -- --deps   # ソースより古い下流ファイルを警告
#
# ノード id:
#   - ファイル: repo ルート相対パス（data/... または docs/...）
#   - パラメータ: PROP-002.hotel.occupancy_rate 等（path に親 YAML）
#
# 自動同期は行わない。チェックリストとして人間が更新する。

version: "1"
description: |
  MAL（株式会社MAL）の Steward OS 正データと人向け成果物の依存関係。
  契約・借入・物件・計画・予実・ダッシュボード・書類 I/O をつなぐ。

nodes:
  # --- 契約 ---
  - id: data/contracts/CTR-008.yaml
    label: CTR-008 金銭消費貸借（番町・LOAN-001）
    category: file
    aliases: [CTR-008]
  - id: data/contracts/CTR-009.yaml
    label: CTR-009 金銭消費貸借（亀沢・LOAN-002）
    category: file
    aliases: [CTR-009]
  - id: data/contracts/CTR-013.yaml
    label: CTR-013 火災保険（番町）
    category: file
    aliases: [CTR-013]
  - id: data/contracts/CTR-014.yaml
    label: CTR-014 火災保険（亀沢）
    category: file
