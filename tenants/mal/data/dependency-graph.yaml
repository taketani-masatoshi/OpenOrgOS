edges:
  # --- 契約 ↔ 借入 ↔ 物件 ---
  - from: data/contracts/CTR-008.yaml
    to: data/finance/loans.yaml
    category: contract→loan
    reason: LOAN-001 の残高・返済条件・contract_id は CTR-008 と一致させる
    action: update
  - from: data/finance/loans.yaml
    to: data/contracts/CTR-008.yaml
    category: contract→loan
    reason: 借入残高変更時は契約書・返済計画 MD を確認
    action: review
  - from: data/contracts/CTR-009.yaml
    to: data/finance/loans.yaml
    category: contract→loan
    reason: LOAN-002 の残高（9,600万）は CTR-009 と PROP-002 取得価格と一致
    action: update
  - from: data/finance/loans.yaml
    to: data/contracts/CTR-009.yaml
    category: contract→loan
    reason: 借入条件変更時は契約書・返済計画を確認
    action: review
  - from: data/contracts/CTR-009.yaml
    to: PROP-002.acquisition_price
    category: contract→loan
    reason: 役員貸付総額＝土地7,000万＋建築2,600万＝取得価格9,600万
    action: update
  - from: PROP-002.acquisition_price
    to: data/finance/loans.yaml
    category: property→plan
    reason: 取得価格変更時は LOAN-002 balance を同期
    action: update
  - from: data/properties/PROP-002.yaml
    to: data/finance/loans.yaml
    category: property→plan
    reason: financing フィールド（LOAN-002）と loans.yaml を整合
    action: review
  - from: data/properties/PROP-001.yaml
    to: data/finance/loans.yaml
    category: property→plan
    reason: financing フィールド（LOAN-001）と loans.yaml を整合
    action: review

  # --- 固定資産 ↔ 物件・借入・費用計画 ---
  - from: data/properties/PROP-001.yaml
    to: data/finance/fixed-assets.yaml
    category: property→plan
    reason: 減価償却前提（depreciation）は ASSET-001 と expense-plan と一致させる
    action: update
  - from: data/properties/PROP-002.yaml
    to: data/finance/fixed-assets.yaml
    category: property→plan
    reason: 土地7,000万・建物2,600万の区分は ASSET-002/003 と LOAN-002 と一致
    action: update
  - from: data/finance/fixed-assets.yaml
    to: data/plans/expense-plan.yaml
    category: data→data
    reason: 年間減価償却額（番町353,191円）は expense-plan depreciation 行と一致
    action: update
  - from: data/finance/fixed-assets.yaml
    to: data/finance/loans.yaml
    category: data→data
    reason: fixed_asset_ids と取得原価合計は借入残高（1.126億）と一致
    action: review
  - from: data/finance/fixed-assets.yaml
    to: docs/finance/fixed-asset-register.md
    category: data→docs
    reason: 固定資産台帳 MD は YAML 更新後に同期
    action: review
  - from: data/finance/tax-profile.yaml
    to: docs/finance/tax-filing-checklist.md
    category: data→docs
    reason: 申告期限・TBD 項目はチェックリスト MD と一致
    action: review
  - from: data/finance/chart-of-accounts.yaml
    to: data/finance/monthly
    category: data→data
    reason: 月次 category_mapping 変更時は月次 YAML 科目整合を確認
    action: review
  - from: data/plans/investment-plan.yaml
    to: data/finance/fixed-assets.yaml
    category: data→data
    reason: CAPEX 確定時は fixed-assets に資産登録
    action: update

  # --- 契約 → CSV ---
  - from: contracts-all
    to: docs/exports/契約管理表.csv
    category: data→docs
    reason: 契約 YAML 更新後は steward sync contracts で CSV を再生成
    action: sync
  - from: data/contracts/CTR-008.yaml
    to: docs/exports/契約管理表.csv
    category: data→docs
    reason: 契約ステータス・金額変更は契約管理表に反映
    action: sync
  - from: data/contracts/CTR-009.yaml
    to: docs/exports/契約管理表.csv
    category: data→docs
    reason: 契約ステータス・金額変更は契約管理表に反映
    action: sync

  # --- 保険契約 → 証券保管 ---
  - from: data/contracts/CTR-013.yaml
    to: records-insurance-bancho
    category: contract→records
    reason: 契約 executed 後、証券 PDF を licenses/ に保管し inbox から登録
    action: update
  - from: data/contracts/CTR-014.yaml
    to: records-insurance-kamezawa
    category: contract→records
    reason: 契約 executed 後、証券 PDF を licenses/insurance/ に保管（最優先）
    action: update
  - from: data/contracts/CTR-013.yaml
    to: data/document-io.yaml
    category: contract→records
    reason: 証券スキャン受領時は io inbox add → done でアーカイブ
    action: review
  - from: data/contracts/CTR-014.yaml
    to: data/document-io.yaml
    category: contract→records
    reason: 証券スキャン受領時は io inbox add → done でアーカイブ
    action: review

  # --- 物件パラメータ → 計画・予実 ---
  - from: PROP-002.hotel.occupancy_rate
    to: data/plans/property-revenue.yaml
    category: parameter→plan
    reason: 稼働率変更は物件別収益前提の月次売上を再計算
    action: update
  - from: PROP-002.hotel.adr
    to: data/plans/property-revenue.yaml
    category: parameter→plan
    reason: ADR 変更は宿泊単価前提を更新
    action: update
  - from: PROP-002.operating_costs
    to: data/plans/yojitsu-fy2026.yaml
    category: parameter→plan
    reason: 清掃・OTA・光熱費等の変更は expense_kamezawa 月次を見直す
    action: update
  - from: PROP-002.operating_costs
    to: data/plans/yojitsu-2026.yaml
    category: parameter→plan
    reason: 運営コスト前提変更はカレンダー予実の expense_kamezawa に反映
    action: update
  - from: PROP-002.operating_costs
    to: data/plans/expense-plan.yaml
    category: parameter→plan
    reason: kamezawa_operations 行の年間運営費を再集計
    action: update
  - from: data/plans/property-revenue.yaml
    to: data/plans/revenue-plan.yaml
    category: data→data
    reason: 物件別収益から FY 売上計画（kamezawa_hotel 等）を更新
    action: update
  - from: data/plans/property-revenue.yaml
    to: data/plans/yojitsu-fy2026.yaml
    category: data→data
    reason: revenue_kamezawa / expense_kamezawa の計画列を同期
    action: update
  - from: data/plans/property-revenue.yaml
    to: data/plans/yojitsu-2026.yaml
    category: data→data
    reason: カレンダー予実の亀沢売上・費用計画列を同期
    action: update

  # --- 固定費 ↔ 費用計画 ↔ 予実 ---
  - from: data/finance/fixed-costs.yaml
    to: data/plans/expense-plan.yaml
    category: data→data
    reason: 本社固定費（通信費等）は expense_company 行に反映
    action: update
  - from: data/finance/fixed-costs.yaml
    to: data/plans/yojitsu-fy2026.yaml
    category: data→data
    reason: 月次 expense_company は fixed-costs の合計と一致させる
    action: update
  - from: data/plans/expense-plan.yaml
    to: data/plans/profit-plan.yaml
    category: data→data
    reason: 費用計画変更は利益計画の費用側を再計算
    action: update
  - from: data/plans/revenue-plan.yaml
    to: data/plans/profit-plan.yaml
    category: data→data
    reason: 売上計画変更は利益計画の収入側を再計算
    action: update
  - from: data/plans/yojitsu-fy2026.yaml
    to: data/plans/profit-plan.yaml
    category: data→data
    reason: 予実確定値は利益計画の実績ベース更新に使用
    action: review
  - from: data/finance/payroll.yaml
    to: data/plans/yojitsu-fy2026.yaml
    category: data→data
    reason: 役員報酬変更は expense_officer 月次を見直す
    action: update

  # --- 計画 → CSV ---
  - from: data/plans/revenue-plan.yaml
    to: docs/exports/売上計画.csv
    category: data→docs
    reason: steward sync all で CSV を再生成
    action: sync
  - from: data/plans/expense-plan.yaml
    to: docs/exports/費用計画.csv
    category: data→docs
    reason: steward sync all で CSV を再生成
    action: sync
  - from: data/plans/profit-plan.yaml
    to: docs/exports/利益計画.csv
    category: data→docs
    reason: steward sync all で CSV を再生成
    action: sync
  - from: data/plans/investment-plan.yaml
    to: docs/exports/投資計画.csv
    category: data→docs
    reason: steward sync all で CSV を再生成
    action: sync

  # --- 予実 → docs MD ---
  - from: data/plans/yojitsu-fy2026.yaml
    to: docs/plans/2026-yojitsu.md
    category: data→docs
    reason: 予実 YAML 更新後は人向け予実 MD を手動または Cursor で同期
    action: review

  # --- ダッシュボード依存 ---
  - from: finances-monthly
    to: report-dashboard
    category: data→reports
    reason: 現金残高・実績ベース CF は月次収支から取得
    action: regenerate
  - from: data/plans/yojitsu-fy2026.yaml
    to: report-dashboard
    category: data→reports
    reason: 未到来月の revenue/expense は yojitsu 計画列を使用
    action: regenerate
  - from: data/finance/fixed-costs.yaml
    to: report-dashboard
    category: data→reports
    reason: バーンレートの固定費部分に本社固定費が含まれる
    action: regenerate
  - from: data/plans/expense-plan.yaml
    to: report-dashboard
    category: data→reports
    reason: 減価償却・運営費は expense-plan 経由でダッシュボードに反映
    action: regenerate
  - from: data/finance/loans.yaml
    to: report-dashboard
    category: data→reports
    reason: 借入返済スケジュールは CF・バーンレートに影響
    action: regenerate
  - from: data/plans/debt-plan.yaml
    to: data/finance/loans.yaml
    category: data→data
    reason: 返済実行・残高変更時は loans.yaml balance と整合
    action: update
  - from: data/finance/loans.yaml
    to: data/plans/debt-plan.yaml
    category: data→data
    reason: 借入残高・条件変更時は debt-plan シナリオを見直す
    action: review
  - from: data/plans/business-plan.yaml
    to: data/plans/debt-plan.yaml
    category: data→data
    reason: funding_plan · borrowing_plan は debt-plan と整合
    action: review
  - from: data/plans/debt-plan.yaml
    to: data/plans/business-plan.yaml
    category: data→data
    reason: 借入方針変更時は business-plan funding_plan を更新
    action: update
  - from: data/plans/profit-plan.yaml
    to: data/plans/debt-plan.yaml
    category: data→data
    reason: DSCR 算定の operating_profit 前提は profit-plan と一致
    action: update
  - from: data/plans/debt-plan.yaml
    to: docs/finance/borrowing-plan.md
    category: data→docs
    reason: debt-plan 更新後は人向け借入計画 MD を同期
    action: review
  - from: data/plans/debt-plan.yaml
    to: docs/finance/loan-repayment-plan.md
    category: data→docs
    reason: 返済シナリオ変更時は返済計画 MD を同期
    action: review
  - from: data/plans/debt-plan.yaml
    to: docs/finance/dscr-plan.md
    category: data→docs
    reason: DSCR 目標・前提変更時は DSCR 計画 MD を同期
    action: review
  - from: data/plans/debt-plan.yaml
    to: report-dashboard
    category: data→reports
    reason: 返済スケジュールは CF 予測・ランウェイに影響
    action: regenerate
  - from: data/finance/fixed-costs.yaml
    to: report-forecast
    category: data→reports
    reason: CF 予測の固定費入力
    action: regenerate
  - from: data/plans/yojitsu-fy2026.yaml
    to: report-forecast
    category: data→reports
    reason: CF 予測の計画月次
    action: regenerate
  - from: data/plans/yojitsu-fy2026.yaml
    to: report-kessan
    category: plan→report
    reason: 決算 PDF の PL 実績は yojitsu から集計
    action: regenerate

  # --- 亀沢公開情報 ↔ ゲスト MD ↔ outbox ---
  - from: data/operations/kamezawa-public.yaml
    to: docs/properties/PROP-002-kamezawa/operations/templates/guest-facing/house-rules.md
    category: operations→docs
    reason: チェックイン時間・人数上限等はゲスト MD と一致させる
    action: review
  - from: data/operations/kamezawa-public.yaml
    to: docs/properties/PROP-002-kamezawa/operations/templates/guest-facing/local-guide-en.md
    category: operations→docs
    reason: アクセス・最寄駅情報を同期
    action: review
  - from: data/operations/kamezawa-public.yaml
    to: docs/properties/PROP-002-kamezawa/operations/templates/guest-facing/welcome-sheet.md
    category: operations→docs
    reason: 連絡先・施設名をウェルカムシートに反映
    action: review
  - from: data/operations/kamezawa-public.yaml
    to: docs/io/outbox/lodging
    category: operations→docs
    reason: ゲスト掲示 PDF 更新時は outbox/lodging に再出力
    action: regenerate
  - from: data/operations/kamezawa-secrets.yaml
    to: docs/io/outbox/lodging
    category: operations→docs
    reason: 鍵・Wi-Fi 変更時は掲示 PDF を再印刷
    action: regenerate

  # --- 法人情報 ---
  - from: data/company.yaml
    to: report-kessan
    category: data→reports
    reason: 決算報告書の会社名・代表者情報
    action: regenerate
  - from: data/company.yaml
    to: docs/exports/契約管理表.csv
    category: data→docs
    reason: オーナー名変更時は契約台帳の owner 列を確認
    action: review

  # --- 社長オペ（Secretary） ---
  - from: data/company.yaml
    to: data/executive/one-on-ones.yaml
    category: data→executive
    reason: 役員・代表者変更時は 1-on-1 レジストリの person/role を確認
    action: review
  - from: data/hr/employees.yaml
    to: data/executive/one-on-ones.yaml
    category: data→executive
    reason: 従業員雇用時は 1-on-1 エントリと EMP ID を紐付け
    action: review
  - from: data/executive/calendar.yaml
    to: docs/executive
    category: executive→docs
    reason: 週次ブリーフ・1-on-1 準備 MD はカレンダーと整合させる
    action: regenerate
  - from: data/executive/tasks.yaml
    to: docs/executive
    category: executive→docs
    reason: 週次ブリーフのタスク表は tasks.yaml と一致させる
    action: regenerate
  - from: data/executive/one-on-ones.yaml
    to: docs/executive
    category: executive→docs
    reason: 1-on-1 準備 MD はレジストリの action_items と同期
    action: regenerate
