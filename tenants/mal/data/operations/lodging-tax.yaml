filing:
  authority: 東京都主税局（千代田都税事務所・宿泊税担当）
  portal_url: https://www.tax.metro.tokyo.lg.jp/kazei/leisure/shuk/jigyousha
  eltax_hint: 電子申告は eLTAX。郵送・持参も可（月計表必須）。
  how_ja: |
    いつ: 各月の宿泊分を翌月末日までに申告・納入（12月分は翌年1月4日。土日祝は翌日）。
    どこで: 千代田都税事務所（郵送・持参）または eLTAX。
    どう: tax-compute → tax-pack（社内サマリ）→ 公式様式で申告 → tax-filed → 納入 → tax-pay。
    漏れ: tax-status / Today「旅館運用」でギャップ確認。OrgOS は行政送信しない。
  lead_days:
    - 14
    - 7
  due_rule: end_of_next_month_tokyo
