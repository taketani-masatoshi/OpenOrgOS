# 認証対象として運用する ISO は catalog available 12。
# 事業に合わない規格は enabled のまま excluded（偽記録で適合を出さない）。
iso:
  - id: ISO-21401
    enabled: true
    notes: サステナブル宿泊（亀沢旅館 PROP-002）
  - id: ISO-9001
    enabled: true
    notes: 品質マネジメント · REG-011 は施行中
  - id: ISO-27001
    enabled: true
    notes: 情報セキュリティ · REG-009 は施行中
  - id: ISO-13485
    enabled: true
    notes: >-
      jp_medical_device On · REG-025/026 は施行中。認証・自己宣言は追わず、
      成熟度は L0 のまま台帳と規程の運用に限る（2026-08-30 CEO 判断）。
      事前検査の不適合は「認証準備の未了」であり、規制対応の欠落ではない。
  - id: ISO-37000
    enabled: true
    notes: 組織ガバナンス Guidance · 自己宣言経路
  - id: ISO-22301
    enabled: true
  - id: ISO-45001
    enabled: true
  - id: ISO-14001
    enabled: true
  - id: ISO-50001
    enabled: true
  - id: ISO-22000
    enabled: true
    applicability: excluded
    exclusion_reason: 食品製造・フードチェーンを営まない（偽 HACCP で適合を出さない）
    notes: 食品安全 · 適用除外
  - id: ISO-37001
    enabled: true
    notes: 贈収賄防止
  - id: ISO-20000
    enabled: true
    notes: IT サービス管理
