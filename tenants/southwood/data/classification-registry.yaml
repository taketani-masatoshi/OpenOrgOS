version: "1"
as_of: 2026-07-12
levels:
  L0:
    label: 公開
    description: 公開情報
    export_allowed: true
  L1:
    label: 社内
    description: 社内情報
    export_allowed: conditional
  L2:
    label: 機密
    description: 機密情報
    export_allowed: false
  L3:
    label: 禁止出力
    description: L2 転記禁止
    export_allowed: false
agents:
  executive_steward:
    label: Executive Steward
    max_level: L2
    output_max_level: L1
  finance:
    label: Finance
    max_level: L2
    output_max_level: L1
  contract:
    label: Contract
    max_level: L1
    output_max_level: L1
  secretary:
    label: Secretary
    max_level: L2
    output_max_level: L1
  compliance:
    label: Compliance
    max_level: L2
    output_max_level: L1
  mail_intake:
    label: Mail Intake
    max_level: L2
    output_max_level: L1
  mail_outbound:
    label: Mail Outbound
    max_level: L2
    output_max_level: L1
  operations:
    label: Operations
    max_level: L2
    output_max_level: L1
  setup:
    label: Setup
    max_level: L2
    output_max_level: L1
  engineering:
    label: Engineering
    max_level: L1
    output_max_level: L1
  cto:
    label: CTO
    max_level: L1
    output_max_level: L1
  security:
    label: Security
    max_level: L1
    output_max_level: L1
resources:
  - id: RES-BANK-ACCOUNTS
    path: data/finance/bank-accounts.yaml
    example_path: data/finance/bank-accounts.yaml.example
    level: L2
    git: ignore
    ai_context: on_demand
    description: 銀行口座
    read_agents:
      - finance
      - compliance
      - secretary
    write_agents:
      - finance
  - id: RES-EXEC-CALENDAR
    path: data/executive/calendar.yaml
    example_path: data/executive/calendar.yaml.example
    level: L1
    git: ignore
    ai_context: on_demand
    description: 社長カレンダー
    read_agents:
      - secretary
      - compliance
    write_agents:
      - secretary
  - id: RES-EXEC-TASKS
    path: data/executive/tasks.yaml
    example_path: data/executive/tasks.yaml.example
    level: L1
    git: ignore
    ai_context: on_demand
    description: 社長タスク
    read_agents:
      - secretary
      - compliance
    write_agents:
      - secretary
  - id: RES-EXEC-ONE-ON-ONES
    path: data/executive/one-on-ones.yaml
    example_path: data/executive/one-on-ones.yaml.example
    level: L1
    git: ignore
    ai_context: on_demand
    description: 1-on-1 レジストリ
    read_agents:
      - secretary
      - compliance
    write_agents:
      - secretary
  - id: RES-EXEC-EXTERNAL-CONTACTS
    path: data/executive/external-contacts.yaml
    example_path: data/executive/external-contacts.yaml.example
    level: L1
    git: ignore
    ai_context: on_demand
    description: 社外連絡先
    read_agents:
      - secretary
      - compliance
    write_agents:
      - secretary
  - id: RES-STAKEHOLDERS
    path: data/executive/stakeholders.yaml
    example_path: data/executive/stakeholders.yaml.example
    level: L1
    git: ignore
    ai_context: on_demand
    description: 利害関係者
    read_agents:
      - secretary
      - contract
      - compliance
    write_agents:
      - secretary
      - contract
  - id: RES-INTEGRATIONS
    path: data/integrations/integrations.yaml
    example_path: data/integrations/integrations.yaml.example
    level: L2
    git: ignore
    ai_context: on_demand
    description: テナント統合設定 · webhook · setup 完了 stamp
    read_agents:
      - secretary
      - operations
      - compliance
    write_agents:
      - operations
  - id: RES-EXEC-MAIL-CONFIG
    path: records/executive/mail-config.yaml
    example_path: records/executive/mail-config.yaml.example
    level: L2
    git: ignore
    ai_context: on_demand
    description: Secretary メール SMTP 設定（パスワードは env）
    read_agents:
      - secretary
      - compliance
    write_agents:
      - secretary
  - id: RES-PROTOCOL-PEERS
    path: data/protocol/peers.yaml
    example_path: data/protocol/peers.yaml.example
    level: L1
    git: track
    ai_context: on_demand
    description: protocol peer 台帳（Secretary 照合 org_uri gate）
    read_agents:
      - secretary
      - compliance
      - contract
    write_agents:
      - compliance
  - id: RES-CASH-BALANCE
    path: data/finance/cash-balance.yaml
    level: L1
    git: track
    ai_context: auto
    description: 現預金残高（口座番号なし · bank_account_id でリンク）
    read_agents:
      - finance
      - executive_steward
      - compliance
      - secretary
    write_agents:
      - finance
  - id: RES-COMPANY-PUBLIC
    path: data/company.yaml
    level: L0
    git: track
    ai_context: auto
    description: 会社概要（公開値含む）· route access アンカー
    read_agents: []
    write_agents:
      - operations
      - secretary
  - id: RES-CLASSIFICATION-REGISTRY
    path: data/classification-registry.yaml
    level: L1
    git: track
    ai_context: auto
    description: データ分類レジストリ
    read_agents:
      - compliance
      - secretary
      - executive_steward
    write_agents:
      - compliance
  - id: RES-EXEC-SCHEDULING-CASES
    path: data/executive/scheduling-cases.yaml
    example_path: data/executive/scheduling-cases.yaml.example
    level: L1
    git: ignore
    ai_context: on_demand
    description: 多者日程調整案件
    read_agents:
      - secretary
      - compliance
    write_agents:
      - secretary
  - id: RES-CORRESPONDENCE-DRAFTS
    path: docs/executive/correspondence-drafts/
    level: L1
    git: ignore
    ai_context: on_demand
    description: 社外メール下書き
    read_agents:
      - mail_outbound
      - secretary
      - compliance
    write_agents:
      - mail_outbound
      - secretary
  - id: RES-EXEC-MAIL-TRIAGE
    path: data/executive/mail-triage-queue.yaml
    example_path: data/executive/mail-triage-queue.yaml.example
    level: L1
    git: ignore
    ai_context: on_demand
    description: Mail Intake トリアージキュー（件名・差出人・分類のみ）
    read_agents:
      - mail_intake
      - secretary
      - compliance
    write_agents:
      - mail_intake
  - id: RES-EXEC-MAIL-RECEIVED
    path: records/executive/mail-received/
    level: L2
    git: ignore
    ai_context: on_demand
    description: 受信メール .eml アーカイブ
    read_agents:
      - mail_intake
      - secretary
    write_agents:
      - mail_intake
  - id: RES-PLATFORM-STEWARD
    path: steward/
    level: L1
    git: track
    ai_context: auto
    description: OrgOS policy, agent, module, and protocol platform definitions
    read_agents:
      - engineering
      - cto
      - security
      - platform_guide
    write_agents:
      - engineering
  - id: RES-PLATFORM-SOURCE
    path: src/
    level: L1
    git: track
    ai_context: auto
    description: OrgOS implementation source
    read_agents:
      - engineering
      - cto
      - security
      - platform_guide
    write_agents:
      - engineering
  - id: RES-PLATFORM-SCHEMAS
    path: schemas/
    level: L1
    git: track
    ai_context: auto
    description: OrgOS data and protocol schemas
    read_agents:
      - engineering
      - cto
      - security
      - platform_guide
    write_agents:
      - engineering
  - id: RES-PLATFORM-TESTS
    path: tests/
    level: L1
    git: track
    ai_context: auto
    description: OrgOS deterministic test suites and fixtures
    read_agents:
      - engineering
      - cto
      - security
      - platform_guide
    write_agents:
      - engineering
  - id: RES-PLATFORM-DOCS
    path: docs/org-os/
    level: L1
    git: track
    ai_context: auto
    description: OrgOS architecture and operations documentation
    read_agents:
      - engineering
      - cto
      - security
      - platform_guide
    write_agents:
      - engineering
      - cto
  - id: RES-ENGINEERING-DOCS
    path: docs/engineering/
    level: L1
    git: track
    ai_context: auto
    description: Tenant engineering decisions and architecture records
    read_agents:
      - engineering
      - cto
      - security
      - platform_guide
    write_agents:
      - engineering
      - cto
rules:
  - id: RULE-GITIGNORE
    text: git:ignore の resource は .gitignore にパターン登録必須。
