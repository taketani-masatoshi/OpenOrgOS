# OrgOS Ledger — 1 customer · 1 tenant · 1 container
# Build: docker build -f deploy/operator/Dockerfile -t orgos-ledger:local .
# Run:   ORGOS_TENANT=acme-corp LEDGER_DATA=/path/to/tenants/acme-corp docker compose --env-file .env.ledger up -d
#
# LEDGER_DATA = tenant directory (contains tenant.yaml). Mounted at /workspace/tenants/$ORGOS_TENANT.
# Named volume holds workspace root (orgos.yaml, product-fleet, sessions).

services:
  ledger:
    image: orgos-ledger:local
    build:
      context: ../..
      dockerfile: deploy/operator/Dockerfile
    ports:
      - "${LEDGER_PORT:-9470}:9470"
    environment:
      ORGOS_TENANT: ${ORGOS_TENANT:?set ORGOS_TENANT}
      ORGOS_ENV: ${ORGOS_ENV:-production}
      ORGOS_WORKSPACE: /workspace
      STEWARD_CHAT_AUTH: "1"
      WIRE_CONSOLE_AUTH: prod
      ORGOS_COOKIE_SECURE: ${ORGOS_COOKIE_SECURE:-1}
      ORGOS_CSRF: "1"
      ORGOS_REQUIRE_REQUEST_TENANT: ${ORGOS_REQUIRE_REQUEST_TENANT:-1}
      ORGOS_PUBLIC_BASE_URL: ${ORGOS_PUBLIC_BASE_URL:?set ORGOS_PUBLIC_BASE_URL}
      STEWARD_CHAT_PUBLIC_URL: ${STEWARD_CHAT_PUBLIC_URL:-${ORGOS_PUBLIC_BASE_URL}}
      ORGOS_LEDGER_HOST_SUFFIX: ${ORGOS_LEDGER_HOST_SUFFIX:?set ORGOS_LEDGER_HOST_SUFFIX}
      WIRE_CONSOLE_WEBAUTHN_RP_ID: ${WIRE_CONSOLE_WEBAUTHN_RP_ID:?set WIRE_CONSOLE_WEBAUTHN_RP_ID}
      WIRE_CONSOLE_WEBAUTHN_ORIGIN: ${WIRE_CONSOLE_WEBAUTHN_ORIGIN:?set WIRE_CONSOLE_WEBAUTHN_ORIGIN}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS:-}
      STRIPE_PRICE_ACCOUNTANT: ${STRIPE_PRICE_ACCOUNTANT:-}
      ORGOS_LEDGER_AUTO_PROVISION: ${ORGOS_LEDGER_AUTO_PROVISION:-0}
      ORGOS_RATE_LIMIT_TENANT_MAX: ${ORGOS_RATE_LIMIT_TENANT_MAX:-60}
      ORGOS_RATE_LIMIT_TENANT_STARTER_MAX: ${ORGOS_RATE_LIMIT_TENANT_STARTER_MAX:-30}
      ORGOS_RATE_LIMIT_TENANT_BUSINESS_MAX: ${ORGOS_RATE_LIMIT_TENANT_BUSINESS_MAX:-60}
      ORGOS_RATE_LIMIT_TENANT_ACCOUNTANT_MAX: ${ORGOS_RATE_LIMIT_TENANT_ACCOUNTANT_MAX:-120}
    volumes:
      - ledger_workspace:/workspace
      - ${LEDGER_DATA:?set LEDGER_DATA}:/workspace/tenants/${ORGOS_TENANT}
    command:
      [
        "orgos",
        "operator",
        "console",
        "start",
        "--host",
        "0.0.0.0",
        "--port",
        "9470",
        "--tenant",
        "${ORGOS_TENANT}",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9470/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s

volumes:
  ledger_workspace:
